<style>
/* Layout: exercise-book page — ruled header with red margin, tabbed workspace, wide scrolling class grid */
:root{
  --paper:#f6f7fb; --card:#ffffff; --ink:#1c2333; --muted:#5b6478; --line:#dde2ec; --rule:#c8d5ef; --margin:#d9606b;
  --accent:#2747b0; --accent-ink:#ffffff; --accent-soft:#e5ebfb;
  --ok:#6fcf97; --ok-strong:#1f7a45; --ok-soft:#d4f0de; --ok-ink:#145c33;
  --no:#cf4b45; --no-soft:#fbdedb; --rev:#d8961a; --rev-soft:#fcefcf;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.06);
  --f-ui:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-display:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;
  --f-word:'Andika','Comic Sans MS','Trebuchet MS',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151e; --card:#1a2030; --ink:#e6e9f2; --muted:#9ba4b7; --line:#2b3346; --rule:#2a3a5f; --margin:#e47d86;
  --accent:#8fa7ff; --accent-ink:#0c1120; --accent-soft:#222c4b;
  --ok:#2f8f58; --ok-strong:#6ee09d; --ok-soft:#1b3a29; --ok-ink:#9fe9bd;
  --no:#ee7b75; --no-soft:#41221f; --rev:#efb54a; --rev-soft:#3d3018;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151e; --card:#1a2030; --ink:#e6e9f2; --muted:#9ba4b7; --line:#2b3346; --rule:#2a3a5f; --margin:#e47d86;
  --accent:#8fa7ff; --accent-ink:#0c1120; --accent-soft:#222c4b;
  --ok:#2f8f58; --ok-strong:#6ee09d; --ok-soft:#1b3a29; --ok-ink:#9fe9bd;
  --no:#ee7b75; --no-soft:#41221f; --rev:#efb54a; --rev-soft:#3d3018;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:relative;padding-block:22px 0;border-bottom:2px solid var(--rule)}
header.top::before{content:"";position:absolute;left:-6px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.8}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4vw,34px);letter-spacing:-.02em;margin:0;text-wrap:balance}
.brand .cls{color:var(--muted);font-size:15px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:14px;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:10px 14px 11px;border-bottom:3px solid transparent;color:var(--muted);font-weight:700;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
.badge{background:var(--rev);color:#1d1400;border-radius:999px;font-size:12px;padding:0 7px;min-width:20px;text-align:center}
.banner{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--accent-soft);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.banner:empty{display:none}
main{margin-top:20px;display:grid;gap:20px}
h2{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:grid;gap:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:700;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok-strong);border-color:var(--ok-strong);color:var(--card)}
.btn.no{background:var(--card);border-color:var(--no);color:var(--no)}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:7px}
input[type=text],input[type=date],select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:140px;resize:vertical}
label.chk{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:8px 14px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.up{color:var(--ok-ink)} .down{color:var(--no)}
/* grid */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
.grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);max-height:75vh}
table.grid{border-collapse:separate;border-spacing:0;font-size:12px}
table.grid th,table.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
table.grid thead th{position:sticky;background:var(--card);z-index:2}
table.grid thead tr:first-child th{top:0;height:26px}
table.grid thead tr:nth-child(2) th{top:26px}
th.blk{font-weight:700;font-variant-numeric:tabular-nums;border-top:5px solid var(--band)!important;border-right:2px solid var(--muted)!important}
th.w{height:74px;width:17px;min-width:17px;vertical-align:bottom;padding-bottom:4px!important;font-weight:400;font-family:var(--f-word)}
th.w span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-size:12px}
th.w.be,td.be{border-right:2px solid var(--muted)!important}
th.name-h,th.pn{position:sticky;left:0;z-index:3;background:var(--card);text-align:left;min-width:150px;max-width:180px;padding:0 8px!important}
th.name-h{z-index:4}
th.pn{font-weight:400;height:28px}
th.pn button{background:none;border:0;padding:4px 0;cursor:pointer;font-weight:700;text-align:left;display:flex;gap:6px;align-items:center;max-width:100%}
th.pn button span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--band);border:1px solid rgba(0,0,0,.25);flex:none}
td.c{width:17px;min-width:17px;height:28px;cursor:pointer}
td.c:hover{outline:2px solid var(--accent);outline-offset:-2px}
.s-known{background:var(--ok)}
.s-secure{background:var(--ok-strong)}
.s-notyet{background:var(--no-soft)}
.s-slipped{background:var(--no-soft);box-shadow:inset 0 -4px 0 var(--no)}
.s-review{background:repeating-linear-gradient(45deg,var(--rev) 0 3px,var(--rev-soft) 3px 6px)}
td.sel{outline:3px solid var(--accent)!important;outline-offset:-3px}
th.score-h,td.score{position:sticky;right:0;background:var(--card);min-width:66px;text-align:center;font-variant-numeric:tabular-nums;z-index:1}
th.score-h{z-index:3}
td.score b{font-size:14px}
td.score small{display:block;font-size:11px;line-height:1}
.cellbar{position:sticky;left:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--accent-soft)}
/* insights */
.ins h3{margin-bottom:8px}
.ins ul{margin:0;padding-left:18px;display:grid;gap:4px}
.wchip{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--line);border-radius:8px;padding:3px 9px;background:var(--paper);font-family:var(--f-word);font-size:16px}
.wchip small{font-family:var(--f-ui);color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.band{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.ai-out{white-space:pre-wrap;line-height:1.55}
/* assess */
.drop{border:2px dashed var(--rule);border-radius:12px;padding:26px;text-align:center;display:grid;gap:8px;justify-items:center;background:var(--paper)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.job{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:start;border-top:1px solid var(--line);padding-top:14px}
.job img{width:120px;border-radius:8px;border:1px solid var(--line);display:block}
@media (max-width:560px){.job{grid-template-columns:1fr}.job img{width:100%;max-width:260px}}
.marks{display:flex;flex-wrap:wrap;gap:5px}
.mk{border:1px solid var(--line);border-radius:7px;padding:3px 7px;background:var(--paper);cursor:pointer;font-size:13px;display:inline-flex;gap:5px;align-items:baseline}
.mk b{font-family:var(--f-word);font-size:15px}
.mk.m-c{background:var(--ok-soft);border-color:var(--ok)}
.mk.m-x{background:var(--no-soft);border-color:var(--no)}
.mk.m-q{background:var(--rev-soft);border-color:var(--rev)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--paper);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok-ink)}
.pill.no{background:var(--no-soft);border-color:var(--no)}
.pill.rev{background:var(--rev-soft);border-color:var(--rev)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.qgrid button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 4px;cursor:pointer;font-family:var(--f-word);font-size:17px;display:grid;line-height:1.1}
.qgrid button small{font-family:var(--f-ui);font-size:11px;color:var(--muted)}
.qgrid button.q-c{background:var(--ok-soft);border-color:var(--ok)}
.qgrid button.q-x{background:var(--no-soft);border-color:var(--no)}
/* review */
.rv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px}
@media (max-width:760px){.rv{grid-template-columns:1fr}}
.rv .photo img{width:100%;border-radius:8px;border:1px solid var(--line)}
.ritem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border-top:1px solid var(--line);padding-block:10px}
.ritem canvas{width:150px;height:70px;border-radius:6px;border:1px solid var(--line);background:var(--paper)}
@media (max-width:560px){.ritem{grid-template-columns:1fr}}
.target{font-family:var(--f-word);font-size:24px;font-weight:700}
/* practise */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kids button{padding:16px 10px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-family:var(--f-word);font-size:20px;font-weight:700;display:grid;gap:6px;justify-items:center}
.ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lw{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper);display:grid;gap:6px}
.lw .word{font-family:var(--f-word);font-size:28px;font-weight:700}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--ok-strong)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px}
.act{text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;gap:4px}
.act:hover{border-color:var(--accent)}
.act b{font-family:var(--f-display);font-size:18px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,40px);display:grid;gap:22px;justify-items:center;text-align:center;min-height:440px;align-content:center}
.big{font-family:var(--f-word);font-weight:700;font-size:clamp(64px,14vw,140px);line-height:1;letter-spacing:.01em;word-break:break-word}
.big .gap{display:inline-block;min-width:.6em;border-bottom:6px solid var(--accent);color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.opt{font-family:var(--f-word);font-weight:700;font-size:clamp(28px,6vw,44px);min-width:110px;padding:12px 22px;border-radius:16px;border:2px solid var(--line);background:var(--paper);cursor:pointer}
.opt.right{background:var(--ok-soft);border-color:var(--ok-strong)}
.opt.wrong{background:var(--no-soft);border-color:var(--no);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.answer{min-height:1.1em;min-width:3em;border-bottom:4px dashed var(--rule);cursor:pointer}
.prog{color:var(--muted);font-weight:700}
.kbtn{font-size:20px;padding:14px 26px;border-radius:14px}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--card);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.15);z-index:20;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 30px)}
.drawer:empty{display:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:30;max-width:calc(100% - 32px)}
.toast:empty{display:none}
.empty{text-align:center;padding:30px 16px;display:grid;gap:10px;justify-items:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hist{display:flex;gap:6px;align-items:flex-end;height:110px;border-bottom:1px solid var(--line);padding-top:16px}
.hist div{flex:1;max-width:44px;background:var(--accent);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.hist div span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}
.histx{display:flex;gap:6px}.histx span{flex:1;max-width:44px;text-align:center;font-size:11px;color:var(--muted)}
.wmap{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;max-width:260px}
.wmap i{aspect-ratio:1;border-radius:3px;border:1px solid var(--line);max-width:100%}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Hundred Words</h1><span class="cls" id="cls"></span></div>
    <nav class="tabs" id="nav" aria-label="Sections"></nav>
  </header>
  <div class="banner" id="banner"></div>
  <main id="main">
    <div class="panel empty"><span class="spin"></span><p class="muted">Opening your class…</p></div>
  </main>
</div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>

<script>
const WORDS=["the","and","a","to","said","in","he","I","of","it","was","you","they","on","she","is","for","at","his","but","that","with","all","an","so","we","can","are","up","had","my","her","what","there","out","this","have","went","be","like","some","not","then","were","go","little","as","no","saw","make","mum","one","them","do","me","down","dad","big","when","it’s","see","looked","very","look","don’t","come","will","into","back","from","children","him","Mr","off","asked","get","just","now","came","oh","about","got","their","people","your","put","could","house","old","too","by","day","made","time","I’m","if","help","Mrs","called","here"];
const SENT=["The dog ran to the park.","I like fish and chips.","I can see a red bus.","We went to the shop.","“Hello,” said Mum.","The cat is in the box.","He kicked the ball.","I am six years old.","I ate a bowl of soup.","Pick it up, please.","It was a sunny day.","Can you see the bird?","They are playing outside.","The book is on the table.","She has a new coat.","My bag is red.","This cake is for you.","Look at the moon.","Sam lost his hat.","I ran fast but I fell over.","Is that your pencil?","Come and play with me.","We all sang a song.","I ate an apple.","I was so happy.","We are going to the beach.","I can ride a bike.","You are my friend.","The kite went up high.","We had pizza for tea.","This is my teddy.","Give the ball to her.","What is your name?","There is a frog in the pond.","Let the dog out.","This is fun!","I have two sisters.","We went to the zoo.","I will be good.","I like ice cream.","Can I have some milk?","It is not raining.","We ate lunch, then we played.","We were very tired.","Let’s go home.","A little mouse ran past.","He is as tall as me.","There is no more juice.","I saw a big ship.","Let’s make a cake.","My mum is kind.","I have one brother.","I gave them a sticker.","What do you want?","Can you see me?","Sit down, please.","My dad can swim.","That is a big dog.","When is lunch?","It’s time for bed.","I can see a rainbow.","She looked under the bed.","The snail was very slow.","Look at my picture.","Don’t run in the hall.","Come here, please.","I will help you.","The frog jumped into the pond.","Put it back on the shelf.","I got a card from Gran.","The children ran outside.","I waved at him.","Mr Smith is our teacher.","Turn off the light.","She asked for a drink.","Go and get your coat.","I am just coming.","Tidy up now, please.","My friend came to play.","Oh no, it’s raining!","This book is about dinosaurs.","I got a new bike.","They put on their coats.","Lots of people came to the party.","Is this your bag?","Put your hand up.","Could you open the door?","My house has a red door.","My shoes are old.","I want to come too.","The book is by the bed.","Today is a sunny day.","I made a card for Mum.","What time is it?","I’m going to the park.","You can play if you are good.","Please help me tidy up.","Mrs Jones has a dog.","My cat is called Tom.","Come and sit here."];
const BANDS=[{n:"Pink",c:"#f2a7c3"},{n:"Red",c:"#e04b4b"},{n:"Yellow",c:"#f4d13d"},{n:"Blue",c:"#4b8ee0"},{n:"Green",c:"#43b16a"},{n:"Orange",c:"#f28a35"},{n:"Turquoise",c:"#29b3ae"},{n:"Purple",c:"#8d5cc7"},{n:"Gold",c:"#c9a227"},{n:"White",c:"#f4f4f4"}];
const STLABEL={none:"Not assessed",known:"Correct",secure:"Secure (correct twice)",notyet:"Not yet",slipped:"Slipped (was correct before)",review:"Waiting for your review"};
const LADDER=["New","Learning","Practising","Ready to check"];

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const z2=n=>String(n).padStart(2,"0");
const localDate=(d=new Date())=>d.getFullYear()+"-"+z2(d.getMonth()+1)+"-"+z2(d.getDate());
const fmtDate=d=>new Date(d+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const fmtShort=d=>new Date(d+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const uid=()=>Math.random().toString(36).slice(2,10);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const isKnown=st=>st==="known"||st==="secure";
const bandOf=i=>BANDS[Math.floor(i/10)];
const pdfText=s=>String(s).replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,"-").replace(/…/g,"...");

/* ---------- state ---------- */
const S={pupils:{},sessions:{},practice:{},plans:{},settings:{className:"",strictCaps:false,acceptNoApos:false,cardsPerChild:10},
  mode:"loading", tab:"tracker",
  ui:{date:localDate(),assessMode:"quick",jobs:[],quick:{pid:"",marks:{},kind:"reading"},cell:null,pupil:null,confirm:null,
      print:{cardLayout:"stack",pages:[0,1,2,3,4],named:false,pids:[],levels:[0],cardsFor:"levels",targetN:10,cardSize:10,cardSent:false,acts:["lcwc","trace","missing","wordsearch","sentences"],actsFor:"pupils",bookDays:5},plan:null,planDraft:{},practise:{pid:null},act:null,ai:null,draft:"",showAll:{}}};
let db=null,assetsApi=null,sampleApi=null,dl=null,imgLimits=null;
const memPhotos={};
let memo={};

function toast(msg){const t=$("#toast");t.textContent=msg;clearTimeout(toast.t);toast.t=setTimeout(()=>t.textContent="",3600)}
const writeChains={};
function saveDoc(col,id,data){
  if(col==="settings")S.settings=data;else S[col][id]=data;
  render();
  if(S.mode!=="live")return Promise.resolve();
  const path=col+"/"+id;
  const p=(writeChains[path]||Promise.resolve()).then(()=>db.doc(path).set(data)).catch(e=>toast(dbErr(e)));
  writeChains[path]=p;return p;
}
function removeDoc(col,id){
  delete S[col][id];render();
  if(S.mode!=="live")return;
  const path=col+"/"+id;
  writeChains[path]=(writeChains[path]||Promise.resolve()).then(()=>db.doc(path).delete()).catch(e=>toast(dbErr(e)));
}
function dbErr(e){return e&&e.code==="quota_exceeded"?"Storage is full — delete old sessions to make room.":"Couldn’t save that change. Check your connection and try again."}

/* ---------- derived ---------- */
function pupilIds(){return Object.keys(S.pupils).filter(id=>!S.pupils[id].archived).sort((a,b)=>S.pupils[a].name.localeCompare(S.pupils[b].name))}
function sessionsFor(pid){
  if(memo["ss"+pid])return memo["ss"+pid];
  return memo["ss"+pid]=Object.entries(S.sessions).filter(([,s])=>s.pupilId===pid).map(([id,s])=>({id,...s})).sort((a,b)=>a.date.localeCompare(b.date));
}
function wordStates(pid,{before,upto}={}){
  const out=Array.from({length:100},()=>({st:"none",hist:[]}));
  for(const s of sessionsFor(pid)){
    if(before&&s.date>=before)continue;
    if(upto&&s.date>upto)continue;
    for(const [k,w] of Object.entries(s.words||{})){const i=+k;if(out[i])out[i].hist.push({date:s.date,sid:s.id,...w})}
  }
  for(const o of out){
    const h=o.hist;if(!h.length)continue;
    const last=h[h.length-1],priorC=h.slice(0,-1).some(x=>x.s==="c");
    o.st=last.s==="?"?"review":last.s==="c"?(priorC?"secure":"known"):(priorC?"slipped":"notyet");
    o.last=last;
  }
  return out;
}
function summary(pid){
  if(memo["sum"+pid])return memo["sum"+pid];
  const ws=wordStates(pid),ss=sessionsFor(pid);
  const count=(arr,f)=>arr.filter(f).length;
  const known=count(ws,w=>isKnown(w.st)),secure=count(ws,w=>w.st==="secure"),review=count(ws,w=>w.st==="review"),assessed=count(ws,w=>w.st!=="none");
  const lastDate=ss.length?ss[ss.length-1].date:null;
  let prevKnown=null;
  if(lastDate){const prev=wordStates(pid,{before:lastDate});if(prev.some(w=>w.st!=="none"))prevKnown=count(prev,w=>isKnown(w.st))}
  let level=10;for(let b=0;b<10;b++){if(ws.slice(b*10,b*10+10).some(w=>!isKnown(w.st))){level=b;break}}
  const next=ws.map((w,i)=>i).filter(i=>!isKnown(ws[i].st)).slice(0,6);
  return memo["sum"+pid]={ws,known,secure,review,assessed,lastDate,prevKnown,delta:prevKnown==null?null:known-prevKnown,level,next,sessions:ss};
}
function reviewItems(){
  const out=[];
  for(const [sid,s] of Object.entries(S.sessions)){
    if(!S.pupils[s.pupilId])continue;
    const flagged=Object.entries(s.words||{}).filter(([,w])=>w.s==="?").map(([k,w])=>({i:+k,...w}));
    if(flagged.length)out.push({sid,s,flagged:flagged.sort((a,b)=>a.i-b.i)});
  }
  return out.sort((a,b)=>a.s.date.localeCompare(b.s.date));
}
function practiceFor(pid){return S.practice[pid]||{boxes:{},log:[]}}

/* ---------- rendering ---------- */
let rq=0;
function render(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;doRender()})}
function doRender(){
  const ae=document.activeElement,aid=ae&&ae.id,sel=aid&&typeof ae.selectionStart==="number"?[ae.selectionStart,ae.selectionEnd]:null;
  memo={};
  $("#cls").textContent=S.settings.className?S.settings.className:"";
  const nrev=reviewItems().reduce((n,r)=>n+r.flagged.length,0);
  const tabs=[["tracker","Tracker"],["assess","Assess"],["review","Review"+(nrev?` <span class="badge">${nrev}</span>`:"")],["practise","Practise"],["plans","Plans"],["print","Print"],["class","Class"]];
  $("#nav").innerHTML=tabs.map(([k,l])=>`<button data-a="tab" data-k="${k}" ${S.tab===k?'aria-current="page"':""}>${l}</button>`).join("");
  $("#banner").innerHTML=bannerHtml();
  $("#main").innerHTML=S.mode==="loading"?`<div class="panel empty"><span class="spin"></span><p class="muted">Opening your class…</p></div>`:(VIEWS[S.tab]||VIEWS.tracker)();
  $("#drawer").innerHTML=S.ui.pupil&&S.pupils[S.ui.pupil]?drawerHtml(S.ui.pupil):"";
  drawCrops();
  if(aid){const el=document.getElementById(aid);if(el){el.focus({preventScroll:true});if(sel&&el.setSelectionRange)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}
function bannerHtml(){
  if(S.mode==="demo")return `<b>Example class.</b><span>These pupils and results are made up so you can explore. Nothing is saved.</span><button class="btn sm" data-a="exitDemo">Start my own class</button>`;
  if(S.mode==="offline")return `<b>Viewing only.</b><span>Saving isn’t available in this view. You can explore with the example class.</span><button class="btn sm" data-a="demo">Load example class</button>`;
  return "";
}
const bandDot=b=>`<span class="dot" style="--band:${BANDS[Math.min(b,9)].c}"></span>`;
function levelLabel(sm){if(!sm.sessions.length)return "Not assessed yet";if(sm.level>=10)return "All 100 correct";const b=BANDS[sm.level];return `${b.n} · words ${sm.level*10+1}–${sm.level*10+10}`}

const VIEWS={};
/* ----- Tracker ----- */
VIEWS.tracker=function(){
  const ids=pupilIds();
  if(!ids.length)return emptyClass();
  const sums=ids.map(id=>[id,summary(id)]);
  const assessed=sums.filter(([,s])=>s.sessions.length);
  const avg=assessed.length?Math.round(assessed.reduce((n,[,s])=>n+s.known,0)/assessed.length):0;
  const deltas=assessed.filter(([,s])=>s.delta!=null);
  const avgDelta=deltas.length?(deltas.reduce((n,[,s])=>n+s.delta,0)/deltas.length):null;
  const nrev=sums.reduce((n,[,s])=>n+s.review,0);
  const cell=S.ui.cell;
  let h=`<div class="stats">
    <div class="stat"><b>${avg}<small class="muted" style="font-size:15px"> /100</small></b><span>Class average correct</span></div>
    <div class="stat"><b class="${avgDelta>0?"up":avgDelta<0?"down":""}">${avgDelta==null?"–":(avgDelta>0?"+":"")+avgDelta.toFixed(1)}</b><span>Average change since previous check</span></div>
    <div class="stat"><b>${assessed.length}<small class="muted" style="font-size:15px"> of ${ids.length}</small></b><span>Pupils assessed</span></div>
    <div class="stat"><b>${nrev}</b><span>Words waiting for your review</span></div>
  </div>
  <div class="row" style="justify-content:space-between">
    <div class="legend">${["known","secure","notyet","slipped","review"].map(k=>`<span><i class="s-${k}"></i>${STLABEL[k]}</span>`).join("")}<span><i></i>Not assessed</span></div>
    <span class="muted small">Tap a pupil for detail, or a square to change a mark.</span>
  </div>`;
  if(cell&&S.pupils[cell.p]){
    const st=summary(cell.p).ws[cell.i];
    h+=`<div class="cellbar"><b>${esc(S.pupils[cell.p].name)}</b><span class="wchip">${esc(WORDS[cell.i])}<small>#${cell.i+1}</small></span><span class="muted">${STLABEL[st.st]}${st.last&&st.last.r!=null&&st.last.r!==""?` · wrote “${esc(st.last.r)}”`:""}</span>
      <span class="row" style="margin-left:auto"><button class="btn sm ok" data-a="setCell" data-s="c">Correct today</button><button class="btn sm no" data-a="setCell" data-s="x">Not yet today</button><button class="btn sm ghost" data-a="closeCell">Close</button></span></div>`;
  }
  h+=`<div class="grid-wrap"><table class="grid"><thead><tr><th class="name-h" rowspan="2">Pupil</th>`;
  for(let b=0;b<10;b++)h+=`<th class="blk" colspan="10" style="--band:${BANDS[b].c}">${b*10+1}–${b*10+10}</th>`;
  h+=`<th class="score-h" rowspan="2">Score<br><span class="muted small">/100</span></th></tr><tr>`;
  for(let i=0;i<100;i++)h+=`<th class="w ${i%10===9?"be":""}"><span>${esc(WORDS[i])}</span></th>`;
  h+=`</tr></thead><tbody>`;
  for(const [id,s] of sums){
    h+=`<tr><th class="pn"><button data-a="openPupil" data-id="${id}" title="${esc(levelLabel(s))}">${s.sessions.length?bandDot(s.level):'<span class="dot" style="--band:transparent"></span>'}<span class="nm">${esc(S.pupils[id].name)}</span></button></th>`;
    for(let i=0;i<100;i++){const st=s.ws[i].st;const sel=cell&&cell.p===id&&cell.i===i;
      h+=`<td class="c s-${st}${i%10===9?" be":""}${sel?" sel":""}" data-a="cell" data-p="${id}" data-i="${i}" title="${esc(WORDS[i])}: ${STLABEL[st]}"></td>`}
    h+=`<td class="score">${s.sessions.length?`<b>${s.known}</b>${s.delta!=null?`<small class="${s.delta>0?"up":s.delta<0?"down":"muted"}">${s.delta>0?"+":""}${s.delta}</small>`:""}`:'<span class="muted">–</span>'}</td></tr>`;
  }
  h+=`</tbody></table></div>`;
  h+=insightsHtml(sums);
  return h;
};
function emptyClass(){
  return `<div class="panel empty">
    <h2>Add your class to begin</h2>
    <p class="muted" style="max-width:52ch">This class has no pupils yet. Add them on the Pupils page and they appear here. Then print the answer sheets, run the spelling check, and enter each child’s results with Quick check in Assess.</p>
    <div class="row" style="justify-content:center">${window.hwHub?`<button class="btn primary" data-a="hubPupils">Go to Pupils</button>`:""}${S.mode!=="demo"?`<button class="btn" data-a="demo">Explore an example class</button>`:""}</div>
  </div>`;
}
function insightsHtml(sums){
  const assessed=sums.filter(([,s])=>s.sessions.length);
  if(!assessed.length)return `<div class="panel"><h3>Insights appear after the first assessment</h3><p class="muted">Print answer sheets from the Print tab, run the check, then enter each child’s results with Quick check in Assess.</p></div>`;
  // most missed
  const miss=Array(100).fill(0),slip=Array(100).fill(0),mis={};
  for(const [,s] of assessed)s.ws.forEach((w,i)=>{
    if(w.st==="notyet"||w.st==="slipped")miss[i]++;
    if(w.st==="slipped")slip[i]++;
    for(const h of w.hist)if(h.s==="x"&&h.r){(mis[i]=mis[i]||{})[h.r.toLowerCase()]=(mis[i][h.r.toLowerCase()]||0)+1}
  });
  const topMiss=miss.map((n,i)=>[i,n]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]||a[0]-b[0]).slice(0,10);
  const slips=slip.map((n,i)=>[i,n]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const pats=Object.entries(mis).flatMap(([i,m])=>Object.entries(m).map(([r,n])=>[+i,r,n])).sort((a,b)=>b[2]-a[2]).slice(0,10);
  // groups
  const groups={};for(const [id,s] of assessed)(groups[s.level]=groups[s.level]||[]).push(id);
  // watch
  const watch=assessed.filter(([,s])=>s.delta!=null&&s.delta<=0).map(([id,s])=>[id,`no gain since last check (${s.known})`]);
  const lowest=assessed.slice().sort((a,b)=>a[1].known-b[1].known).slice(0,3).filter(([id])=>!watch.some(w=>w[0]===id)).map(([id,s])=>[id,`lowest scores (${s.known})`]);
  const stars=assessed.filter(([,s])=>s.delta!=null&&s.delta>=10).sort((a,b)=>b[1].delta-a[1].delta).slice(0,5);
  // ready to check from practice
  const ready=[];for(const [id,s] of sums){const b=practiceFor(id).boxes||{};const r=Object.entries(b).filter(([i,v])=>v>=3&&!isKnown(s.ws[+i].st)).map(([i])=>+i);if(r.length)ready.push([id,r])}
  const name=id=>esc(S.pupils[id].name);
  let h=`<div class="cols">`;
  h+=`<div class="panel ins"><h3>Teach to the whole class</h3><p class="muted small" style="margin-bottom:10px">Words the most pupils still can’t spell.</p>
    <div class="chips">${topMiss.map(([i,n])=>`<span class="wchip">${esc(WORDS[i])}<small>${n} of ${assessed.length}</small></span>`).join("")||'<span class="muted">Every assessed word is correct.</span>'}</div>
    ${slips.length?`<p class="small" style="margin-top:12px"><b>Slipping:</b> ${slips.map(([i,n])=>`${esc(WORDS[i])} (${n})`).join(", ")}. These were correct before and wrong last time.</p>`:""}</div>`;
  h+=`<div class="panel ins"><h3>Groups by level</h3><p class="muted small" style="margin-bottom:10px">Grouped by the first set of ten each pupil hasn’t finished.</p><div class="stack">
    ${Object.keys(groups).sort((a,b)=>a-b).map(l=>`<div><span class="band">${bandDot(+l)}${+l>=10?"All 100 correct":`${BANDS[l].n} <span class="muted small">(${l*10+1}–${l*10+10})</span>`}</span><div class="small">${groups[l].map(name).join(", ")}</div></div>`).join("")}</div></div>`;
  h+=`<div class="panel ins"><h3>Common misspellings</h3><p class="muted small" style="margin-bottom:10px">What children actually wrote. Useful for spotting phonics gaps.</p>
    ${pats.length?`<ul>${pats.map(([i,r,n])=>`<li><b style="font-family:var(--f-word)">${esc(WORDS[i])}</b> → “${esc(r)}” <span class="muted">×${n}</span></li>`).join("")}</ul>`:'<p class="muted">Misspellings appear once marked sheets are saved.</p>'}</div>`;
  h+=`<div class="panel ins"><h3>Pupils to look at</h3><ul>${[...watch,...lowest].map(([id,why])=>`<li><a href="#" data-a="openPupil" data-id="${id}">${name(id)}</a> <span class="muted">— ${why}</span></li>`).join("")||'<li class="muted">No concerns flagged.</li>'}</ul>
    ${stars.length?`<p class="small" style="margin-top:10px"><b>Big gains:</b> ${stars.map(([id,s])=>`${name(id)} (+${s.delta})`).join(", ")}</p>`:""}
    ${ready.length?`<p class="small" style="margin-top:10px"><b>Ready to check</b> (practised to the top of the ladder): ${ready.map(([id,r])=>`${name(id)} (${r.map(i=>esc(WORDS[i])).join(", ")})`).join("; ")}</p>`:""}</div>`;
  h+=`</div>`;
  const ai=S.ui.ai;
  h+=`<div class="panel stack"><div class="row" style="justify-content:space-between"><h3>Written summary</h3>${sampleApi?`<button class="btn" data-a="aiSummary" ${ai&&ai.status==="thinking"?"disabled":""}>${ai&&ai.text?"Write again":"Write a summary with Claude"}</button>`:""}</div>
    <div class="ai-out" id="aiOut">${ai?(ai.text?esc(ai.text):ai.status==="thinking"?'<span class="spin"></span> Thinking…':esc(ai.err||"")):`<span class="muted">${sampleApi?"Claude reads the figures above and writes a short summary you can paste into notes or a report.":"Written summaries aren’t available in Classroom Hub."}</span>`}</div></div>`;
  return h;
}
function drawerHtml(pid){
  const p=S.pupils[pid],s=summary(pid),pr=practiceFor(pid);
  const dates=[...new Set(s.sessions.map(x=>x.date))];
  const pts=dates.map(d=>[d,wordStates(pid,{upto:d}).filter(w=>isKnown(w.st)).length]);
  const mis=[];s.ws.forEach((w,i)=>w.hist.forEach(h=>{if(h.s==="x"&&h.r)mis.push([i,h.r,h.date])}));
  let h=`<div class="stack">
  <div class="row" style="justify-content:space-between"><h2>${esc(p.name)}</h2><button class="btn ghost" data-a="closePupil" aria-label="Close">Close</button></div>
  <div class="row"><span class="band">${s.sessions.length?bandDot(s.level):""}${esc(levelLabel(s))}</span></div>
  <div class="stats"><div class="stat"><b>${s.known}</b><span>correct /100</span></div><div class="stat"><b>${s.secure}</b><span>secure</span></div><div class="stat"><b class="${s.delta>0?"up":s.delta<0?"down":""}">${s.delta==null?"–":(s.delta>0?"+":"")+s.delta}</b><span>since previous</span></div></div>`;
  if(pts.length){const max=100;h+=`<div><h3>Progress</h3><div class="hist">${pts.map(([d,n])=>`<div style="height:${Math.max(2,n/max*100)}%"><span>${n}</span></div>`).join("")}</div><div class="histx">${pts.map(([d])=>`<span>${fmtShort(d)}</span>`).join("")}</div></div>`}
  h+=`<div><h3>Focus words</h3><div class="ladder" style="margin-top:8px">${practiseWords(pid).map(i=>{const b=(pr.boxes||{})[i]||0;return `<div class="lw"><span class="small muted">#${i+1} · ${bandOf(i).n}</span><span class="word">${esc(WORDS[i])}</span><div class="steps">${[1,2,3].map(k=>`<i class="${b>=k?"on":""}"></i>`).join("")}</div><span class="small muted">${LADDER[b]}</span></div>`}).join("")||'<p class="muted">All 100 correct.</p>'}</div></div>
  <div class="row"><button class="btn primary" data-a="practiseWith" data-id="${pid}">Practise now</button><button class="btn" data-a="openPlan" data-id="${pid}">Progression plan</button><button class="btn" data-a="pdfPupilCards" data-id="${pid}">Flash cards PDF</button><button class="btn" data-a="pdfPupilSheet" data-id="${pid}">Check sheet PDF</button></div>`;
  if(mis.length)h+=`<div><h3>What ${esc(p.name.split(" ")[0])} wrote</h3><div class="chips" style="margin-top:8px">${mis.slice(-24).reverse().map(([i,r])=>`<span class="wchip">${esc(r)}<small>for ${esc(WORDS[i])}</small></span>`).join("")}</div></div>`;
  h+=`<div><h3>Assessments</h3><div class="stack" style="margin-top:8px">${s.sessions.map(x=>{const w=Object.values(x.words||{});const c=w.filter(v=>v.s==="c").length,q=w.filter(v=>v.s==="?").length;const conf=S.ui.confirm==="ses"+x.id;
    return `<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:8px"><span><b>${fmtDate(x.date)}</b> <span class="muted small">${x.kind==="reading"?"reading":"spelling"} · ${w.length} words · ${c} correct${q?` · ${q} to review`:""}</span></span><button class="btn sm ${conf?"no":"ghost"}" data-a="delSession" data-id="${x.id}">${conf?"Confirm delete":"Delete"}</button></div>`}).join("")||'<p class="muted">No assessments yet.</p>'}</div></div>`;
  return h+`</div>`;
}

/* ----- Assess ----- */
VIEWS.assess=function(){
  /* Classroom Hub: Quick check only. Photo marking is not offered yet;
     photoView() is kept, unreachable, for when it comes back. */
  let h=`<div class="row" style="justify-content:space-between"><h2>Assess</h2></div>`;
  if(!pupilIds().length)return h+`<div class="panel empty"><p>Add pupils on the Pupils page first.</p>${window.hwHub?`<button class="btn" data-a="hubPupils">Go to Pupils</button>`:""}</div>`;
  return h+quickView();
};
function photoView(){
  const canPhoto=sampleApi&&imgLimits;
  let h=`<div class="panel stack">
  <div class="row"><label for="aDate"><b>Assessment date</b></label><input type="date" id="aDate" data-c="date" value="${S.ui.date}"></div>`;
  if(!canPhoto)h+=`<p class="muted">Photo marking isn’t available in Classroom Hub. Use <a href="#" data-a="amode" data-k="quick">Quick check</a> to enter marks by hand.</p>`;
  else h+=`<div class="drop" id="drop"><h3>Add photos of answer sheets</h3><p class="muted small" style="max-width:56ch">One photo per sheet, taken from above in good light with the whole page in frame. Claude reads each child’s writing exactly as written, marks it against the word list, and sends anything unclear to Review.</p><button class="btn primary" data-a="pick">Choose photos</button></div>`;
  h+=`</div>`;
  const jobs=S.ui.jobs;
  if(jobs.length){
    const ready=jobs.filter(j=>j.status==="done"&&j.pid).length;
    h+=`<div class="panel stack"><div class="row" style="justify-content:space-between"><h3>Sheets (${jobs.length})</h3><div class="row">${ready?`<button class="btn primary" data-a="saveAll">Save ${ready} marked sheet${ready>1?"s":""}</button>`:""}<button class="btn ghost" data-a="clearJobs">Clear list</button></div></div>`;
    for(const j of jobs)h+=jobHtml(j);
    h+=`</div>`;
  }
  return h;
}
function jobHtml(j){
  let body="";
  if(j.status==="queued")body=`<p class="muted">Waiting…</p>`;
  else if(j.status==="reading")body=`<p><span class="spin"></span> Reading handwriting… this can take up to a minute.</p>`;
  else if(j.status==="error")body=`<p class="down">${esc(j.err)}</p><div class="row"><button class="btn sm" data-a="retryJob" data-j="${j.id}">Try again</button><button class="btn sm ghost" data-a="dropJob" data-j="${j.id}">Remove</button></div>`;
  else{
    const b=j.boxes;const c=b.filter(x=>x.s==="c").length,x=b.filter(x=>x.s==="x").length,q=b.filter(x=>x.s==="?").length;
    const opts=pupilIds().map(id=>`<option value="${id}" ${j.pid===id?"selected":""}>${esc(S.pupils[id].name)}</option>`).join("");
    body=`<div class="row"><label for="jp${j.id}" class="small"><b>Pupil</b></label><select id="jp${j.id}" data-c="jobPupil" data-j="${j.id}" ${j.status==="saved"?"disabled":""}><option value="">Choose…</option>${opts}</select>

function photoSrc(p){if(!p)return null;if(p.startsWith("mem:"))return memPhotos[p.slice(4)]||null;return "/_blob/"+p}
const imgCache={};
function loadImg(src){if(!imgCache[src])imgCache[src]=new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src});return imgCache[src]}
function drawCrops(){
  document.querySelectorAll("canvas[data-crop]").forEach(async cv=>{
    try{const im=await loadImg(cv.dataset.crop);const [x,y,w,h]=cv.dataset.box.split(",").map(Number);
      const px=w*.35,py=h*.6;const sx=Math.max(0,(x-px))*im.naturalWidth,sy=Math.max(0,(y-py))*im.naturalHeight;
      const sw=Math.min(1,w+2*px)*im.naturalWidth,sh=Math.min(1,h+2*py)*im.naturalHeight;
      const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
      const sc=Math.min(cv.width/sw,cv.height/sh);const dw=sw*sc,dh=sh*sc;
      ctx.drawImage(im,sx,sy,sw,sh,(cv.width-dw)/2,(cv.height-dh)/2,dw,dh);
    }catch(e){}
  });
}

function voiceScore(v){const n=v.name;let sc=0;

function canvasBlob(cv){return new Promise(r=>cv.toBlob(r,"image/jpeg",.88))}
async function prepImages(file){
  const url=URL.createObjectURL(file);
  const im=new Image();im.src=url;await im.decode();
  const W=im.naturalWidth,H=im.naturalHeight;
  const cut=async(y0,y1)=>{const sh=(y1-y0)*H;const sc=Math.min(1,2000/Math.max(W,sh));const cv=document.createElement("canvas");cv.width=Math.round(W*sc);cv.height=Math.round(sh*sc);cv.getContext("2d").drawImage(im,0,y0*H,W,sh,0,0,cv.width,cv.height);return canvasBlob(cv)};
  const full=await cut(0,1),top=await cut(0,.55),bot=await cut(.45,1);
  URL.revokeObjectURL(url);
  return {full,top,bot};
}
function photoPrompt(three){
  const roster=pupilIds().map(id=>S.pupils[id].name);
  return `You are helping a primary school teacher mark a high-frequency word SPELLING check from a photo of one child's answer sheet.

The sheet has a printed header (Name, Date, and a word-number range such as "Words 21-40") and numbered answer boxes. Each box's printed number is the number of the word in the list below. The teacher read each word aloud and the child wrote it in the matching box.
${three?"Image 1 is the whole sheet. Images 2 and 3 are the top and bottom halves of the same sheet at higher resolution; use them to read small letters.":"The image is the whole sheet."}

Word list (number: word):
${WORDS.map((w,i)=>`${i+1}: ${w.replace(/’/g,"'")}`).join("\n")}

Class list: ${roster.join("; ")||"(none)"}

For EVERY numbered box on the sheet:
- "read": transcribe EXACTLY what the child wrote, letter by letter, keeping their capitals and apostrophes. Never correct their spelling. Young children's misspellings are expected (e.g. "sed", "wos", "thay") and must be copied as written. If a letter is reversed (b/d, p/q, s, j) write the letter it was meant to be and set "reversal": true. If the child crossed something out, transcribe their final attempt.
- "confidence": "high" only if you are certain of every letter. Use "low" if any letter is ambiguous, faint, overwritten, cut off, or could be read two ways, or if you are not sure which box the writing belongs to.
- "blank": true if the box is empty (then read is "").
- "note": a few words if anything is unusual (e.g. "second letter could be a or o"), else "".
- "box": approximate [x, y, width, height] of the child's writing in image 1, as fractions 0-1 of the image width and height.

Also read the name written or printed on the sheet, and if it clearly matches someone on the class list give that exact class-list name as "rosterMatch".

Reply with only this JSON:
{"name": string|null, "rosterMatch": string|null, "boxes": [{"n": number, "read": string, "confidence": "high"|"low", "blank": boolean, "reversal": boolean, "note": string, "box": [number,number,number,number]}], "issues": string}
"issues" is "" unless the photo has a problem the teacher should know about (blurred, part of the page missing, not an answer sheet).`;
}
function normWord(t,target){
  let x=String(t||"").trim().replace(/[’‘`´]/g,"'").replace(/^["“”]+|[.,!?;:"“”]+$/g,"");
  let y=target.replace(/’/g,"'");
  if(S.settings.acceptNoApos){x=x.replace(/'/g,"");y=y.replace(/'/g,"")}
  const strict=S.settings.strictCaps&&/[A-Z]/.test(y);
  if(!strict){x=x.toLowerCase();y=y.toLowerCase()}
  return [x,y];
}
function markBox(b){
  const n=Math.round(Number(b.n));if(!(n>=1&&n<=100))return null;
  const r=b.blank?"":String(b.read??"").trim();
  const [x,y]=normWord(r,WORDS[n-1]);
  const ai=r&&x===y?"c":"x";
  const s=b.blank?"x":(b.confidence!=="high"||b.reversal)?"?":ai;
  const box=Array.isArray(b.box)&&b.box.length===4&&b.box.every(v=>typeof v==="number"&&v>=0&&v<=1)?b.box:null;
  return {n,r,ai,s,conf:b.confidence==="high"?"high":"low",note:[b.reversal?"reversed letter":"",b.note||""].filter(Boolean).join("; "),box};
}
function matchPupil(res){
  const ids=pupilIds();const norm=s=>String(s||"").toLowerCase().replace(/[^a-z ]/g,"").trim();
  const exact=ids.find(id=>norm(S.pupils[id].name)===norm(res.rosterMatch))||ids.find(id=>norm(S.pupils[id].name)===norm(res.name));
  if(exact)return exact;
  const n=norm(res.name);if(!n)return "";
  const hits=ids.filter(id=>{const pn=norm(S.pupils[id].name);return pn.split(" ")[0]===n.split(" ")[0]});
  return hits.length===1?hits[0]:"";
}
let jobRunning=false;
async function runJobs(){
  if(jobRunning)return;jobRunning=true;
  try{
    let j;
    while((j=S.ui.jobs.find(x=>x.status==="queued"))){
      j.status="reading";render();
      try{
        if(!j.imgs)j.imgs=await prepImages(j.file);
        j.blob=j.imgs.full;
        const three=(imgLimits.maxCount||1)>=3;
        const res=await sampleApi.json(photoPrompt(three),{images:three?[j.imgs.full,j.imgs.top,j.imgs.bot]:[j.imgs.full],modelTier:"complex"});
        if(!res||!Array.isArray(res.boxes))throw {code:"invalid_json"};
        const seen=new Set();
        j.boxes=res.boxes.map(markBox).filter(b=>b&&!seen.has(b.n)&&seen.add(b.n)).sort((a,b)=>a.n-b.n);
        if(!j.boxes.length)throw {code:"no_boxes"};
        j.nameRead=res.name||"";j.issues=res.issues||"";j.pid=j.pid||matchPupil(res);
        j.status="done";
      }catch(e){
        j.status="error";
        j.err=e.code==="not_granted"?"Claude access wasn’t allowed for this page. Allow it from the page’s permissions to mark photos.":
          e.code==="rate_limited"?"Claude is busy or your usage limit was reached. Wait a moment, then try again.":
          e.code==="image_rejected"?"That image couldn’t be used. Try a JPEG or PNG photo.":
          e.code==="no_boxes"?"No numbered answer boxes were found. Check the photo shows a whole answer sheet.":
          e.code==="invalid_json"?"Claude’s reply couldn’t be read. Try again.":
          (e instanceof Error&&!e.code)?"This photo couldn’t be opened. If it’s HEIC, export it as JPEG.":"Something went wrong reading this sheet. Try again.";
        if(e.code==="not_granted"){S.ui.jobs.forEach(x=>{if(x.status==="queued"){x.status="error";x.err=j.err}})}
      }
      render();
    }
  }finally{jobRunning=false}
}
function addFiles(files){
  for(const f of files){if(!f.type.startsWith("image/")&&!/\.(heic|heif)$/i.test(f.name))continue;
    S.ui.jobs.push({id:uid(),file:f,status:"queued",url:URL.createObjectURL(f),pid:""})}
  render();runJobs();
}
async function saveJob(j){
  if(!j.pid){toast("Choose the pupil first");return}
  j.status="saving";render();
  let photo="mem:"+j.id;memPhotos[j.id]=j.blob?URL.createObjectURL(j.blob):j.url;
  if(assetsApi&&S.mode==="live"&&j.blob){try{const a=await assetsApi.upload(j.blob);photo=a.id}catch(e){toast("Photo not stored; marks saved. You can still review this session now.")}}
  const sid=j.pid+"_"+S.ui.date,old=S.sessions[sid];
  const words={...((old&&old.words)||{})};
  for(const b of j.boxes){const w={s:b.s,r:b.r,ai:b.ai,conf:b.conf,note:b.note,photo,src:"photo"};if(b.box)w.box=b.box;words[b.n-1]=w}
  await saveDoc("sessions",sid,{pupilId:j.pid,date:S.ui.date,kind:"spelling",words,photos:[...((old&&old.photos)||[]),photo],updatedAt:Date.now()});
  j.status="saved";render();

function scriptPages(doc,indices,heading,first){

/* ---------- progression plans ---------- */
const ERR={blank:"Left blank",sounded:"Sounded out or another attempt",vowel:"Vowel mix-up",missing:"Missed a letter",extra:"Added a letter",order:"Letters in the wrong order",apostrophe:"Missed the apostrophe",caps:"Capital letter",reversal:"Reversed letters (b/d, p/q)"};
function isSubseq(a,b){let j=0;for(const ch of b){if(ch===a[j])j++}return j===a.length}
function classify(target,read){
  const t=target.replace(/’/g,"'").toLowerCase(),raw=String(read||"").replace(/[’‘]/g,"'").trim(),r=raw.toLowerCase();
  if(!r)return "blank";
  if(r===t)return "caps";
  if(t.includes("'")&&r===t.replace(/'/g,""))return "apostrophe";
  const v=s=>s.replace(/[aeiouy]/g,"*");
  if(r.length===t.length&&v(r)===v(t))return "vowel";
  if(r.length===t.length-1&&isSubseq(r,t))return "missing";
  if(r.length===t.length+1&&isSubseq(t,r))return "extra";
  if(r.length===t.length&&[...r].sort().join("")===[...t].sort().join(""))return "order";
  return "sounded";
}
const addDays=(d,n)=>{const x=new Date(d+"T12:00");x.setDate(x.getDate()+n);return localDate(x)};
const wl=a=>a.map(i=>WORDS[i]).join(", ");
function buildPlan(pid){
  if(memo["plan"+pid])return memo["plan"+pid];
  const s=summary(pid),pl=S.plans[pid]||{},pr=practiceFor(pid),boxes=pr.boxes||{},first=S.pupils[pid].name.split(" ")[0];
  const assessed=s.sessions.length>0,plateau=s.delta!=null&&s.delta<=0,gains=s.delta!=null&&s.delta>=10;
  const autoN=plateau?3:gains?8:5,focusN=pl.focusN||autoN;
  const idx=s.ws.map((w,i)=>i);
  const revisit=idx.filter(i=>s.ws[i].st==="slipped").slice(0,5);
  const open=idx.filter(i=>!isKnown(s.ws[i].st)&&s.ws[i].st!=="slipped");
  const focus=open.slice(0,focusN),nextUp=open.slice(focusN,focusN+5);
  const pats={};const add=(k,i,r)=>{const p=pats[k]=pats[k]||{n:0,ex:[]};p.n++;if(r&&p.ex.length<3)p.ex.push([i,r])};
  s.ws.forEach((w,i)=>{if(w.st!=="notyet"&&w.st!=="slipped")return;const last=[...w.hist].reverse().find(h=>h.s==="x");if(!last||last.r==null)return;
    add(classify(WORDS[i],last.r),i,last.r);if(/revers/i.test(last.note||""))add("reversal",i,last.r)});
  const n=k=>pats[k]?pats[k].n:0,ex=k=>(pats[k]?pats[k].ex:[]).map(([i,r])=>`“${r}” for ${WORDS[i]}`).join(", ");
  const ready=Object.entries(boxes).filter(([i,v])=>v>=3&&!isKnown(s.ws[+i].st)).map(([i])=>+i);
  const recs=[];
  if(!assessed)recs.push({t:"Baseline check",f:"This week",d:"Run the spelling check (Print > Answer sheets) so this plan can be based on real results. Until then it starts from the first words on the list."});
  if(plateau)recs.push({t:"Smaller steps",f:"Daily",d:`No gain since the last check, so the focus set is ${focusN} words. Short daily 1:1 practice works better than longer weekly sessions.`});
  if(focus.length)recs.push({t:"Flash cards",f:"5 minutes daily",d:`Read the ${focus.length} focus words quickly. Keep any ‘not yet’ cards in the pile and go round again.`});
  if(n("blank")>=3&&n("blank")>=n("sounded"))recs.push({t:"Recognise before spelling",f:"Daily",d:`${n("blank")} words were left blank. Build reading first: Listen and find in the app, and spot the words in reading books, before asking for spellings.`});
  if(n("sounded")>=2)recs.push({t:"Look, say, cover, write, check",f:"3 times a week",d:`${first} is sounding words out (${ex("sounded")}). Point out the tricky part of each word, then use the look-cover-write-check sheet.`});
  if(n("vowel")+n("missing")+n("extra")>=2)recs.push({t:"Missing letters",f:"Twice a week",d:`Most letters are right but one is missed or swapped (${[ex("vowel"),ex("missing"),ex("extra")].filter(Boolean).join(", ")}). Use the missing-letters sheet and say each sound while writing.`});
  if(n("order"))recs.push({t:"Build the word",f:"Twice a week",d:`The right letters are there in the wrong order (${ex("order")}). Use letter tiles or the Build the word game.`});
  if(n("reversal"))recs.push({t:"Letter formation",f:"Daily warm-up",d:"Some letters are reversed. Use the trace-and-write sheet and model the correct formation for b, d, p and q."});
  if(n("apostrophe"))recs.push({t:"Contractions",f:"One short lesson, then revisit",d:"Teach it’s = it is, don’t = do not, I’m = I am, and show the apostrophe standing in for the missing letter."});
  if(revisit.length)recs.push({t:"Revisit slipped words",f:"Daily warm-up",d:`${wl(revisit)} ${revisit.length>1?"were":"was"} correct before. Add ${revisit.length>1?"them":"it"} back into flash cards until secure.`});
  if(ready.length)recs.push({t:"Re-check",f:"Next 1:1",d:`${wl(ready)} reached the top of the practice ladder. Check ${ready.length>1?"them":"it"} 1:1 and mark in Quick check.`});
  if(gains)recs.push({t:"Keep the pace",f:"Ongoing",d:`Strong progress (+${s.delta}) since the last check, so the focus set is ${focusN} words.`});
  if(focus.length)recs.push({t:"Practise games and sentences",f:"2–3 times a week",d:"Games in the Practise tab, plus dictating the sentence for each focus word (Print > Dictation script)."});
  const reviewDate=pl.reviewDate||addDays(s.lastDate||localDate(),14);
  const criteria=focus.length||revisit.length?`${first} spells ${wl([...focus,...revisit])} correctly in two separate checks.`:`${first} keeps all 100 words secure.`;
  const log=pr.log||[];
  return memo["plan"+pid]={s,pl,first,focusN,autoN,focus,nextUp,revisit,pats,recs,ready,reviewDate,criteria,plateau,gains,assessed,sessions:log.length,lastPractice:log.length?log[log.length-1].date:null,boxes};
}

  c.textAlign="left";c.font=`400 19px ${FU}`;c.fillStyle="#666";c.fillText("Look at each word and say it. Fold along the dashed line to cover it. Write it, unfold and check. Tick when it’s right.",x0,HH-58,x1-x0);

function drawCover(c,pid,words,days){
  const p=buildPlan(pid),x0=90,x1=HW-72,band=p.assessed?BANDS[Math.min(p.s.level,9)].c:"#cccccc";
  c.fillStyle=band;rr(c,40,40,30,HH-80,12);c.fill();
  c.textAlign="left";c.fillStyle="#111";c.font=`700 54px ${FW}`;c.fillText(`${p.first}’s spelling book`,x0,112);
  c.font=`400 22px ${FU}`;c.fillStyle="#555";c.fillText([S.settings.className,`Started ____________`,`Check by ${fmtDate(p.reviewDate)}`].filter(Boolean).join("     ·     "),x0,150);
  c.font=`700 22px ${FU}`;c.fillStyle="#333";c.fillText("My words",x0,200);
  let x=x0,y=258;c.font=`700 44px ${FW}`;
  words.forEach(i=>{const t=WORDS[i],tw=c.measureText(t).width+40;if(x+tw>x1){x=x0;y+=74}c.strokeStyle=BANDS[Math.floor(i/10)].c==="#f4f4f4"?"#999":BANDS[Math.floor(i/10)].c;c.lineWidth=4;rr(c,x,y-48,tw,64,14);c.stroke();c.fillStyle="#111";c.fillText(t,x+20,y);x+=tw+14});
  y+=52;c.font=`400 21px ${FU}`;c.fillStyle="#333";y=wrapText(c,"My target: "+p.criteria,x0,y,x1-x0,28)+8;
  const n=words.length,cols=days,ww=220,cell=Math.min(66,(x1-x0-ww)/cols),rh=Math.min(44,(HH-80-y-40)/(n+1));
  c.font=`700 18px ${FU}`;c.fillStyle="#333";c.textAlign="center";
  for(let d=0;d<cols;d++)c.fillText(days>5?String(d+1):WEEKDAYS[d].slice(0,3),x0+ww+d*cell+cell/2,y+rh*.65);
  c.textAlign="left";c.fillText("Tick when I got it right",x0,y+rh*.65);
  words.forEach((i,k)=>{const yy=y+(k+1)*rh;c.font=`400 ${Math.min(30,rh*.7)}px ${FW}`;c.fillStyle="#111";c.fillText(WORDS[i],x0+10,yy+rh*.72,ww-20);
    c.strokeStyle="#9aa3b5";c.lineWidth=1.5;for(let d=0;d<cols;d++)c.strokeRect(x0+ww+d*cell+4,yy+3,cell-8,rh-6)});

/* A book's A5 pages, in order: a cover (not for a single day), then a
   page per day with the words in a fresh order each day. */
function bookPages(pid,days){
  const words=bookWords(pid);if(!words.length)return null;
  const pages=days>1?[c=>drawCover(c,pid,words,days)]:[];
  for(let d=0;d<days;d++){const r=rngFrom(hashStr(pid)+d*7919),order=d===0?words:words.map(v=>[r(),v]).sort((a,b)=>a[0]-b[0]).map(p=>p[1]);pages.push(c=>drawDay(c,pid,order,d,days))}
  return pages;
}
/* Stack and cut. Every book in a print has the same number of pages, and
   sheet k carries page k of one book on top and page k of the next book
   below. Print single-sided, square the stack, cut once across the middle:
   each pile is a run of complete books, already in page order. A lone book
   is split instead: first half down the top, second half down the bottom. */
function layBooks(doc,books){
  if(books.length===1){const b=books[0],m=Math.ceil(b.length/2);for(let k=0;k<m;k++)bookPage(doc,[b[k],b[m+k]]);return}
  for(let j=0;j<books.length;j+=2){const a=books[j],b=books[j+1]||[];for(let k=0;k<a.length;k++)bookPage(doc,[a[k],b[k]])}
}
function bookNote(names,days){
  const what=days>1?`${days}-day books`:"one-day pages",n=names.length;
  if(n===1)return days>1?`Print single-sided, square the stack and cut across the middle. Put the bottom pile under the top pile and staple: that’s ${names[0]}’s book in page order.`:`Print and cut across the middle.`;
  const top=names.filter((_,k)=>k%2===0),bot=names.filter((_,k)=>k%2===1);
  return `${n} ${what} on ${Math.ceil(n/2)*(days>1?days+1:1)} A4 sheets. Print single-sided, square the stack and cut once across the middle (the A4 half). Top pile, in order: ${top.join(", ")}. Bottom pile: ${bot.join(", ")}.${days>1?" Each book is the next "+(days+1)+" pages of its pile.":""}`;
}

async function aiSummary(){
  const ids=pupilIds().filter(id=>summary(id).sessions.length);
  const lines=ids.map(id=>{const s=summary(id);return `${S.pupils[id].name}: ${s.known}/100 correct, ${s.secure} secure, level ${s.level>=10?"complete":BANDS[s.level].n+" (words "+(s.level*10+1)+"-"+(s.level*10+10)+")"}, change since previous check ${s.delta==null?"n/a":s.delta}, next words: ${s.next.map(i=>WORDS[i]).join(", ")}`});
  const miss=Array(100).fill(0);ids.forEach(id=>summary(id).ws.forEach((w,i)=>{if(w.st==="notyet"||w.st==="slipped")miss[i]++}));
  const top=miss.map((n,i)=>[WORDS[i],n]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,15).map(([w,n])=>`${w} (${n})`).join(", ");
  const mis=[];ids.forEach(id=>summary(id).ws.forEach((w,i)=>w.hist.forEach(h=>{if(h.s==="x"&&h.r)mis.push(`${WORDS[i]}→${h.r}`)})));
  const prompt=`You are helping a UK primary school teacher understand their class's progress on the 100 high frequency words (spelling check). Write 5-7 short bullet points (use "• "), plain UK English, no headings, under 200 words. Cover: whole-class teaching priorities, any phonics patterns in the misspellings, suggested small groups, pupils who need a closer look, and something to celebrate. Only use the data below; do not invent figures.

Class: ${S.settings.className||"(unnamed)"}, ${ids.length} pupils assessed.
Words most pupils can't yet spell (count of pupils): ${top||"none"}
Sample of misspellings (target→written): ${mis.slice(0,80).join(", ")||"none recorded"}
Pupils:
${lines.join("\n")}`;
  S.ui.ai={status:"thinking",text:""};render();
  try{
    await sampleApi(prompt,{onText:({text})=>{S.ui.ai.text=text;S.ui.ai.status="writing";const o=$("#aiOut");if(o)o.textContent=text}});
    S.ui.ai.status="done";

  render();
}

      for(let i=0;i<100;i++){const p=1/(1+Math.exp(-((ab*115-i)/7)));const ok=rnd()<p;const w=WORDS[i];
        words[i]={s:ok?"c":"x",r:ok?w:(MIS[i]&&rnd()<.6?MIS[i]:w.length>2?w.slice(0,-1):""),src:"photo"}}
      if(t===1&&k%7===2){words[5+k]={s:"?",r:WORDS[5+k].replace(/[ae]/,"o"),ai:"x",conf:"low",note:"one letter could be read two ways",src:"photo"}}
      sessions[id+"_"+d]={pupilId:id,date:d,kind:"spelling",words}});
    if(k%3===0){const b={};let n=0;for(let i=0;i<100&&n<6;i++){if(sessions[id+"_2026-10-06"].words[i].s!=="c"){b[i]=1+Math.floor(rnd()*3);n++}}practice[id]={boxes:b,log:[]}}
  });
  Object.assign(S,{pupils,sessions,practice,plans:{},settings:{className:"Year 1 Oak (example)",strictCaps:false,acceptNoApos:false,cardsPerChild:10},mode:"demo"});
  S.ui.jobs=[];S.ui.ai=null;S.tab="tracker";render();
}
function exitDemo(){
  if(saved){Object.assign(S,{pupils:saved.pupils,sessions:saved.sessions,practice:saved.practice,plans:saved.plans,settings:saved.settings,mode:saved.mode});saved=null}
  S.ui.pupil=null;S.ui.cell=null;S.ui.ai=null;S.ui.act=null;S.ui.practise.pid=null;S.ui.plan=null;S.tab=pupilIds().length?"tracker":"class";render();
}

/* ---------- boot ---------- */
(async function boot(){
  render();
  if(!window.claude||!window.claude.use){S.mode="offline";render();return}
  const [d,sa,as,dw]=await Promise.all(["db","sample","assets","downloads"].map(n=>window.claude.use(n).catch(()=>null)));
  sampleApi=sa;assetsApi=as;dl=dw;
  if(sampleApi){try{imgLimits=(await sampleApi.limits()).images||null}catch(e){imgLimits=null}}
  if(!d){if(saved)saved.mode="offline";else S.mode="offline";render();return}
  db=d;
  const target=()=>saved||S;
  const ready={};
  const markReady=k=>{if(!ready[k]){ready[k]=1;if(Object.keys(ready).length===5){if(saved)saved.mode="live";else S.mode="live"}}render()};
  const lost=()=>toast("Lost connection to your saved data. Reload to reconnect.");
  for(const col of ["pupils","sessions","practice","plans"])db.collection(col).onSnapshot(snap=>{const o={};snap.docs.forEach(x=>o[x.id]=x.data());target()[col]=o;markReady(col)},lost);
  db.doc("settings/main").onSnapshot(snap=>{target().settings={className:"",strictCaps:false,acceptNoApos:false,cardsPerChild:10,...(snap.exists?snap.data():{})};markReady("settings")},lost);
})();
</script>
