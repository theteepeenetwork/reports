<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spellings</title>
<!-- Classroom Hub: class-key routing, then the storage that stands in for
     the claude.ai runtime this page was written for. Both must load before
     the page script below. -->
<script src="js/classkeys.js?v=4"></script>
<script src="js/hundred-words-runtime.js?v=2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Andika:wght@400;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Classroom Hub look (css/app.css): Schibsted Grotesk, cobalt primary, white cards on a
   near-white page. The words themselves stay in Andika and the book-band colours are kept. */
:root{
  --paper:#f5f6f8; --card:#ffffff; --ink:#14181d; --ink-2:#4a525c; --muted:#687079; --line:#e6e9ee; --line-2:#f0f2f5; --ctl:#d9dde4; --rule:#c8d0dc;
  --accent:#2f55e0; --accent-ink:#ffffff; --accent-text:#1f3fb8; --accent-soft:#eef2fd; --accent-mid:#6b86ec;
  --ok:#a7d8bd; --ok-strong:#1f8a5b; --ok-soft:#e9f6ef; --ok-ink:#14663f; --ok-btn:#14663f;
  --no:#e11d48; --no-soft:#fff1f4; --no-ink:#9f1239; --no-line:#f5b5c2;
  --rev:#b9810f; --rev-soft:#faf3e1; --rev-ink:#7a5408;
  --shadow:0 4px 14px rgba(20,24,29,.05),0 1px 2px rgba(20,24,29,.04);
  --f-ui:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-display:var(--f-ui);
  --f-word:'Andika','Comic Sans MS','Trebuchet MS',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1217; --card:#181c23; --ink:#e8ebf0; --ink-2:#c3c8cf; --muted:#9aa3ae; --line:#2a303a; --line-2:#222831; --ctl:#3a414d; --rule:#3a414d;
  --accent:#2f55e0; --accent-ink:#ffffff; --accent-text:#9db1f7; --accent-soft:#1c2647; --accent-mid:#8fa6f3;
  --ok:#2b6b4a; --ok-strong:#4cc38a; --ok-soft:#15301f; --ok-ink:#8fe0b5; --ok-btn:#14663f;
  --no:#f0627f; --no-soft:#3a1820; --no-ink:#ffa3b5; --no-line:#7a2e40;
  --rev:#e0b04a; --rev-soft:#3a2e12; --rev-ink:#f0cf85;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1217; --card:#181c23; --ink:#e8ebf0; --ink-2:#c3c8cf; --muted:#9aa3ae; --line:#2a303a; --line-2:#222831; --ctl:#3a414d; --rule:#3a414d;
  --accent:#2f55e0; --accent-ink:#ffffff; --accent-text:#9db1f7; --accent-soft:#1c2647; --accent-mid:#8fa6f3;
  --ok:#2b6b4a; --ok-strong:#4cc38a; --ok-soft:#15301f; --ok-ink:#8fe0b5; --ok-btn:#14663f;
  --no:#f0627f; --no-soft:#3a1820; --no-ink:#ffa3b5; --no-line:#7a2e40;
  --rev:#e0b04a; --rev-soft:#3a2e12; --rev-ink:#f0cf85;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{margin:0;font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
:focus-visible{outline:3px solid var(--accent-mid);outline-offset:2px}
.wrap{max-width:1152px;margin:0 auto;padding:12px 16px 48px}
/* inside the hub the content column already has its own padding */
.framed .wrap{padding:2px 3px 40px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
.brand .h1row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-top:4px}
.brand h1{font-weight:800;font-size:32px;letter-spacing:-.01em;line-height:1.15;margin:0}
.brand .cls{color:var(--muted);font-size:14px}
.topnav{display:flex;align-items:flex-end;gap:8px;min-width:0;max-width:100%}
nav.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);min-width:0}
nav.tabs button{background:none;border:0;padding:0 2px;min-height:44px;border-bottom:2px solid transparent;color:var(--muted);font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
.cog{flex:none;width:44px;height:44px;padding:0;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.cog:hover{background:var(--line-2)}
.cog[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.badge{background:var(--rev-soft);color:var(--rev-ink);border-radius:999px;font-size:12px;padding:0 7px;min-width:20px;text-align:center}
.banner{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--accent-soft);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.banner:empty{display:none}
main{margin-top:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
h2{font-weight:800;font-size:20px;letter-spacing:-.005em;margin:0;text-wrap:balance}
h3{font-weight:800;font-size:17px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:grid;gap:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.btn{border:1px solid var(--ctl);background:var(--card);color:var(--ink);padding:0 16px;min-height:44px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none}
.btn:hover{border-color:var(--accent-mid)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:#2748c4;border-color:#2748c4}
.btn.ok{background:var(--ok-btn);border-color:var(--ok-btn);color:#fff}
.btn.no{background:var(--card);border-color:var(--no);color:var(--no-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--line-2);border-color:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:0 12px;font-size:13px}
input[type=text],input[type=date],select,textarea{border:1px solid var(--ctl);background:var(--card);border-radius:10px;padding:0 12px;min-height:44px;min-width:0;font-size:14px;max-width:100%}
textarea{width:100%;min-height:140px;resize:vertical;padding:10px 12px}
label.chk{display:inline-flex;gap:10px;align-items:center;cursor:pointer;min-height:44px}
label.chk input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--line-2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:0 14px;min-height:44px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{color:var(--muted);font-size:13px}
.up{color:var(--ok-ink)} .down{color:var(--no-ink)}
/* tests */
.sechead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.tbar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.day{padding:0;overflow:hidden}
.dayhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;padding:16px 20px}
.dayhead h2{font-size:18px}
.trow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.2fr) 150px 286px;align-items:center;gap:8px 16px;padding:10px 20px;border-top:1px solid var(--line-2)}
.tname{text-align:left;border:0;background:none;padding:0;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-height:44px;justify-content:center;min-width:0}
.tname b{font-size:16px}
.tname:hover b{text-decoration:underline}
.tprog{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.bar i.full{background:var(--ok-strong)}
.tres{font-size:13px;color:var(--ink-2)}
.tacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tdet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 20px;padding:4px 20px 20px;background:var(--paper);border-top:1px solid var(--line-2)}
.tdet h4{margin:14px 0 8px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tdet .wchip{background:var(--card)}
.tedit{grid-column:1/-1;padding-top:12px}
.kid{border:0;min-height:44px;cursor:pointer;font-family:inherit}
.kid:hover{text-decoration:underline}
.pcard{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:18px 20px}
label.fld{display:grid;gap:4px;font-size:13px;color:var(--ink-2);font-weight:600}
@media (max-width:980px){.trow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.tname{grid-column:1/-1}.tacts{grid-column:1/-1;justify-content:flex-start}}
@media (max-width:560px){.tdet{grid-template-columns:1fr}.dayhead,.trow{padding-left:14px;padding-right:14px}.tdet{padding:4px 14px 16px}}
.bignum{font-size:34px;font-weight:800;line-height:1.1}
.note{font-size:13px;line-height:1.5;background:var(--paper);border-radius:10px;padding:10px 12px}
.linkbtn{background:none;border:0;padding:0;min-height:44px;color:var(--accent-text);font-weight:600;font-size:14px;cursor:pointer;text-align:left;display:inline-flex;align-items:center}
.linkbtn:hover{text-decoration:underline}
.wd{font-family:var(--f-word)}
/* mark */
.markbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.markbar label{font-size:14px;font-weight:600}
.markbar select{flex:0 1 auto;min-width:0;max-width:100%}
.marklay{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.plist{flex:1 1 240px;max-width:270px;min-width:0;padding:12px}
.plist .phead{display:flex;justify-content:space-between;align-items:baseline;padding:6px 12px 10px;font-size:14px}
.pls{display:flex;flex-direction:column;gap:2px;max-height:72vh;overflow-y:auto}
.pl{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:44px;border:0;border-radius:10px;background:transparent;cursor:pointer;font-size:14px;color:var(--ink);flex:none}
.pl:hover{background:var(--line-2)}
.pl[aria-current="true"]{background:var(--accent-soft);font-weight:700}
.pl .st{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent-text);white-space:nowrap}
.pl .st.done{color:var(--ok-ink)}
.markcard{flex:999 1 520px;min-width:0;padding:24px;display:flex;flex-direction:column;gap:18px}
.markcard h2{font-size:26px}
.score{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.score small{font-size:16px;color:var(--muted);font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:84px;min-width:0;padding:16px 4px 6px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink)}
.tile .wd{font-size:clamp(17px,2vw,26px);line-height:1.2;max-width:100%;overflow-wrap:anywhere}
.tile.long .wd{font-size:clamp(13px,1.3vw,18px)}
.tile .hint{font-size:11px;font-weight:600;color:var(--muted);min-height:14px}
.tile .n{position:absolute;top:5px;left:9px;font-size:11px;font-weight:700;color:var(--muted)}
.tile .tk{position:absolute;top:3px;right:9px;font-weight:800;font-size:16px}
.tile.focus{border-color:var(--accent-mid)}
.tile.c{border-color:var(--ok-strong);background:var(--ok-soft)}
.tile.c .tk{color:var(--ok-ink)}
.tile.x{border-color:var(--no);background:var(--no-soft)}
.tile.x .tk{color:var(--no-ink)}
.wrote{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.wrote label{display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
.wrote input{font-family:var(--f-word);font-size:16px;width:100%}
@media (max-width:760px){
  .plist{max-width:none;flex-basis:100%}
  .pls{flex-direction:row;overflow-x:auto;max-height:none;gap:6px;padding-bottom:4px}
  .pl{width:auto;white-space:nowrap;border:1px solid var(--line)}
  .markcard{padding:16px}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tile .wd{font-size:20px}.tile.long .wd{font-size:14px}
}
/* grid */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--band);border:1px solid rgba(0,0,0,.18);flex:none}
/* pupils */
.f{font-size:13px;font-weight:600;padding:0 14px;min-height:44px;border-radius:999px;border:1px solid var(--ctl);background:var(--card);color:var(--ink-2);cursor:pointer}
.f[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.pcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.pcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.pcards{grid-template-columns:1fr}}
.pc{padding:16px 18px;display:flex;flex-direction:column;gap:10px;text-align:left;color:var(--ink);cursor:pointer;align-items:stretch;font-size:15px}
.pc:hover{border-color:var(--accent-mid)}
.pc .pn{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;min-width:0}
.pc .pn .dot{width:14px;height:14px}
.pc .chips{min-height:32px}
.wchip.again{border-color:var(--no-line)}
details.more{position:relative}
details.more>summary{list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more .menu{position:absolute;right:0;top:calc(100% + 6px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:grid;gap:2px;min-width:230px}
details.more .menu .btn{justify-content:flex-start;border-color:transparent}
/* print */
.printlay{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.pmenu{flex:1 1 300px;max-width:340px;min-width:0;padding:8px}
.grp{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--muted);padding:14px 12px 4px;text-transform:uppercase}
.it{width:100%;text-align:left;display:flex;gap:12px;align-items:center;padding:10px 12px;min-height:56px;border:0;border-radius:10px;background:transparent;cursor:pointer;color:var(--ink)}
.it:hover{background:var(--line-2)}
.it[aria-current="true"]{background:var(--accent-soft)}
.it .ic{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:800;font-size:13px}
.ic.blue{background:var(--accent-soft);color:var(--accent-text)}
.it[aria-current="true"] .ic.blue{background:var(--card)}
.ic.green{background:var(--ok-soft);color:var(--ok-ink)}
.ic.amber{background:var(--rev-soft);color:var(--rev-ink)}
.it b{display:block;font-size:14px}
.it small{font-size:12px;color:var(--muted)}
.pcfg{flex:999 1 480px;min-width:0;padding:24px;display:flex;flex-direction:column;gap:20px}
.pcfg h2{font-size:22px}
.popt{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.optl{font-size:13px;font-weight:700;color:var(--ink-2)}
.f.sq{border-radius:10px;display:inline-flex;align-items:center;gap:6px}
.outbar{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:16px;border-radius:12px;background:var(--paper)}
.sheet{width:62px;height:84px;border-radius:4px;background:#fff;border:1px solid var(--ctl);box-shadow:3px 3px 0 var(--line),6px 6px 0 var(--line-2);flex:none}
@media (max-width:760px){.pmenu{max-width:none;flex-basis:100%}.pcfg{padding:16px}}
/* class */
.stat4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:900px){.stat4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat4 .stat{display:flex;flex-direction:column;gap:2px}
.stat b small{font-size:16px;color:var(--muted);font-weight:800}
.scrollx{overflow-x:auto;padding-bottom:2px}
.bands{display:grid;grid-template-columns:repeat(10,minmax(92px,1fr));gap:8px}
.bandcol{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;background:var(--paper);min-height:150px;min-width:0}
.bandcol .bh{display:flex;align-items:center;gap:6px;font-size:13px}
.bandcol .bh .ct{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted)}
.bandcol .rg{font-size:11px;color:var(--muted)}
.nm{font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:0 6px;min-height:44px;color:var(--ink);cursor:pointer;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm:hover{border-color:var(--accent-mid)}
.nm.na{border-style:dashed;color:var(--ink-2)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.three{grid-template-columns:1fr}}
:root{--sq-d:#cdebd9;--sq-p:#f4e7c4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sq-d:#1f4a33;--sq-p:#4a3a14}}
:root[data-theme="dark"]{--sq-d:#1f4a33;--sq-p:#4a3a14}
table.sg{width:100%;border-collapse:separate;border-spacing:3px;font-variant-numeric:tabular-nums}
table.sg th{font-size:12px;font-weight:700;color:var(--ink-2);padding:2px;min-width:64px;line-height:1.5}
table.sg th.pn{text-align:left;min-width:120px;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap}
table.sg th.pn .linkbtn{color:var(--ink)}
table.sg td{text-align:center;padding:0}
table.sg td.sc{font-size:14px;font-weight:700;padding-left:8px;white-space:nowrap;text-align:left}
table.sg td.sc small{font-size:12px;font-weight:600}
.cell{font-weight:700;font-size:13px;width:100%;min-width:44px;height:44px;border:0;border-radius:6px;cursor:pointer;padding:0}
.cell.d{background:var(--sq-d);color:var(--ok-ink)}
.cell.p{background:var(--sq-p);color:var(--rev-ink)}
.cell.n{background:var(--paper);color:var(--muted)}
.cell[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.sqbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;border-radius:12px;background:var(--accent-soft)}
.sqbar button.wchip{min-height:44px;cursor:pointer;background:var(--card)}
.sqbar button.wchip.ok{background:var(--ok-soft);border-color:var(--ok)}
.sqbar button.wchip.no{background:var(--no-soft);border-color:var(--no-line)}
.sqbar button.wchip[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.cellbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);flex-basis:100%}
td.sel{outline:3px solid var(--accent)!important;outline-offset:-3px}
th.score-h,td.score{position:sticky;right:0;background:var(--card);min-width:66px;text-align:center;font-variant-numeric:tabular-nums;z-index:1}
th.score-h{z-index:3}
td.score b{font-size:14px}
td.score small{display:block;font-size:11px;line-height:1}
/* insights */
.ins h3{margin-bottom:8px}
.ins ul{margin:0;padding-left:18px;display:grid;gap:4px}
.wchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--paper);color:var(--ink);font-family:var(--f-word);font-size:16px;white-space:nowrap;text-decoration:none}
.wchip small{font-family:var(--f-ui);color:var(--muted);font-size:11px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.band{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.ai-out{white-space:pre-wrap;line-height:1.55}
/* assess */
.drop{border:2px dashed var(--rule);border-radius:12px;padding:26px;text-align:center;display:grid;gap:8px;justify-items:center;background:var(--paper)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.job{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:start;border-top:1px solid var(--line);padding-top:14px}
.job img{width:120px;border-radius:8px;border:1px solid var(--line);display:block}
@media (max-width:560px){.job{grid-template-columns:1fr}.job img{width:100%;max-width:260px}}
.marks{display:flex;flex-wrap:wrap;gap:5px}
.mk{border:1px solid var(--line);border-radius:7px;padding:3px 7px;background:var(--paper);cursor:pointer;font-size:13px;display:inline-flex;gap:5px;align-items:baseline}
.mk b{font-family:var(--f-word);font-size:15px}
.mk.m-c{background:var(--ok-soft);border-color:var(--ok)}
.mk.m-x{background:var(--no-soft);border-color:var(--no)}
.mk.m-q{background:var(--rev-soft);border-color:var(--rev)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok-ink)}
.pill.no{background:var(--no-soft);color:var(--no-ink)}
.pill.rev{background:var(--rev-soft);color:var(--rev-ink)}
.pill.blue{background:var(--accent-soft);color:var(--accent-text)}
.gtab{width:100%;border-collapse:collapse}.gtab th{text-align:left;white-space:nowrap;padding:8px 12px 8px 0;vertical-align:top;font-weight:700}.gtab td{padding:6px 0;line-height:2.2}.gtab tr+tr{border-top:1px solid var(--line)}
/* review */
.rv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px}
@media (max-width:760px){.rv{grid-template-columns:1fr}}
.rv .photo img{width:100%;border-radius:8px;border:1px solid var(--line)}
.ritem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border-top:1px solid var(--line);padding-block:10px}
.ritem canvas{width:150px;height:70px;border-radius:6px;border:1px solid var(--line);background:var(--paper)}
@media (max-width:560px){.ritem{grid-template-columns:1fr}}
.target{font-family:var(--f-word);font-size:24px;font-weight:700}
/* practise */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kids button{padding:16px 10px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-family:var(--f-word);font-size:20px;font-weight:700;display:grid;gap:6px;justify-items:center}
.ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lw{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper);display:grid;gap:6px}
.lw .word{font-family:var(--f-word);font-size:28px;font-weight:700}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--ok-strong)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px}
.act{text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;gap:4px}
.act:hover{border-color:var(--accent)}
.act b{font-family:var(--f-display);font-size:18px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,40px);display:grid;gap:22px;justify-items:center;text-align:center;min-height:440px;align-content:center}
.big{font-family:var(--f-word);font-weight:700;font-size:clamp(64px,14vw,140px);line-height:1;letter-spacing:.01em;word-break:break-word}
.big .gap{display:inline-block;min-width:.6em;border-bottom:6px solid var(--accent);color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.opt{font-family:var(--f-word);font-weight:700;font-size:clamp(28px,6vw,44px);min-width:110px;padding:12px 22px;border-radius:16px;border:2px solid var(--line);background:var(--paper);cursor:pointer}
.opt.right{background:var(--ok-soft);border-color:var(--ok-strong)}
.opt.wrong{background:var(--no-soft);border-color:var(--no);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.answer{min-height:1.1em;min-width:3em;border-bottom:4px dashed var(--rule);cursor:pointer}
.prog{color:var(--muted);font-weight:700}
.kbtn{font-size:20px;padding:14px 26px;border-radius:14px}
/* pupil panel */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--card);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(20,24,29,.12);z-index:20;overflow-y:auto;padding:env(safe-area-inset-top,0px) 0 calc(env(safe-area-inset-bottom,0px) + 24px)}
.drawer:empty{display:none}
.ptop{padding:20px 24px 16px;display:flex;flex-direction:column;gap:14px}
.ptop h2{font-size:24px}
.iconbtn{width:44px;padding:0;font-size:20px;line-height:1}
.avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none;background:var(--band);color:#14181d;border:1px solid rgba(0,0,0,.12)}
.avatar.none{background:var(--line-2);color:var(--ink)}
.mini3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini{background:var(--paper);border-radius:10px;padding:10px 12px}
.mini b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.mini b small{font-size:13px;color:var(--muted);font-weight:700}
.mini span{font-size:12px;color:var(--muted)}
.mini.bad{background:var(--no-soft)}.mini.bad b,.mini.bad span{color:var(--no-ink)}
.mini.good{background:var(--ok-soft)}.mini.good b,.mini.good span{color:var(--ok-ink)}
.pnote{font-size:14px;line-height:1.5;border-radius:10px;padding:12px 14px;background:var(--paper);color:var(--ink-2)}
.pnote.warn{background:var(--rev-soft);color:var(--rev-ink)}
.pnote.good{background:var(--ok-soft);color:var(--ok-ink)}
.sec{padding:18px 24px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:10px}
.sec h3{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.fw{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.fw .wd{font-size:20px}
.fw small{font-size:12px;color:var(--muted);min-width:92px;text-align:right}
.lad{display:flex;gap:4px}
.lad i{width:22px;height:8px;border-radius:4px;background:var(--line)}
.lad i.on{background:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:10px;height:96px}
.bars div{flex:1;min-width:0;max-width:90px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.bars i{width:100%;border-radius:4px;background:var(--accent-soft);border:1px solid var(--line);min-height:3px}
.bars div:last-child i{background:var(--accent);border-color:var(--accent)}
.bars span{font-size:11px;color:var(--muted);white-space:nowrap}
.sec summary{cursor:pointer;font-size:14px;font-weight:600;min-height:44px;display:flex;align-items:center}
.sec label.fld{display:grid;gap:4px;font-size:13px;color:var(--ink-2);font-weight:600}

.toast:empty{display:none}
.empty{text-align:center;padding:30px 16px;display:grid;gap:10px;justify-items:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Words go in sets of ten, in list order: set g is words g*10 to g*10+9.
   Every list starts on a multiple of ten, so a set never spans two lists.
   A child moves on to the next set only when every word in it is correct. */
const NSETS=Math.ceil(WORDS.length/10);
const listIdxOf=i=>LISTS.findIndex(l=>i>=l.a&&i<l.b);
const listOf=i=>LISTS[listIdxOf(i)];
const num=i=>i-listOf(i).a+1;
const setWords=g=>{const out=[];for(let i=g*10;i<Math.min(g*10+10,WORDS.length);i++)out.push(i);return out};
const setLabel=g=>{const w=setWords(g);return `${listOf(w[0]).short} ${num(w[0])}–${num(w[w.length-1])}`};
const listWords=l=>{const out=[];for(let i=l.a;i<l.b;i++)out.push(i);return out};
const listSets=l=>{const out=[];for(let g=l.a/10;g<Math.ceil(l.b/10);g++)out.push(g);return out};

const writeChains={};
function saveDoc(col,id,data){

function dbErr(e){return e&&e.code==="quota_exceeded"?"Storage is full — delete old sessions to make room.":"Couldn’t save that change. Check your connection and try again."}

/* ---------- derived ---------- */
function pupilIds(){return Object.keys(S.pupils).filter(id=>!S.pupils[id].archived).sort((a,b)=>S.pupils[a].name.localeCompare(S.pupils[b].name))}
function sessionsFor(pid){
  if(memo["ss"+pid])return memo["ss"+pid];
  return memo["ss"+pid]=Object.entries(S.sessions).filter(([,s])=>s.pupilId===pid).map(([id,s])=>({id,...s})).sort((a,b)=>a.date.localeCompare(b.date));
}
function wordStates(pid,{before,upto}={}){
  const out=Array.from({length:WORDS.length},()=>({st:"none",hist:[]}));
  for(const s of sessionsFor(pid)){
    if(before&&s.date>=before)continue;
    if(upto&&s.date>upto)continue;
    for(const [k,w] of Object.entries(s.words||{})){const i=+k;if(out[i])out[i].hist.push({date:s.date,sid:s.id,...w})}
  }
  for(const o of out){
    const h=o.hist;if(!h.length)continue;
    const last=h[h.length-1],priorC=h.slice(0,-1).some(x=>x.s==="c");
    o.st=last.s==="?"?"review":last.s==="c"?(priorC?"secure":"known"):(priorC?"slipped":"notyet");
    o.last=last;
  }
  return out;
}
function summary(pid){
  if(memo["sum"+pid])return memo["sum"+pid];
  const ws=wordStates(pid),ss=sessionsFor(pid);
  const count=(arr,f)=>arr.filter(f).length;
  const known=count(ws,w=>isKnown(w.st)),secure=count(ws,w=>w.st==="secure"),review=count(ws,w=>w.st==="review"),assessed=count(ws,w=>w.st!=="none");
  const lastDate=ss.length?ss[ss.length-1].date:null;
  let prevKnown=null;
  if(lastDate){const prev=wordStates(pid,{before:lastDate});if(prev.some(w=>w.st!=="none"))prevKnown=count(prev,w=>isKnown(w.st))}
  let level=NSETS;for(let b=0;b<NSETS;b++){if(setWords(b).some(i=>!isKnown(ws[i].st))){level=b;break}}
  const knownIn=LISTS.map(l=>listWords(l).filter(i=>isKnown(ws[i].st)).length),setDone=level<NSETS?setWords(level).filter(i=>isKnown(ws[i].st)).length:0;
  const next=ws.map((w,i)=>i).filter(i=>!isKnown(ws[i].st)).slice(0,6);
  return memo["sum"+pid]={ws,known,secure,review,assessed,lastDate,prevKnown,delta:prevKnown==null?null:known-prevKnown,level,knownIn,setDone,next,sessions:ss};
}
function reviewItems(){
  const out=[];
  for(const [sid,s] of Object.entries(S.sessions)){
    if(!S.pupils[s.pupilId])continue;
    const flagged=Object.entries(s.words||{}).filter(([,w])=>w.s==="?").map(([k,w])=>({i:+k,...w}));
    if(flagged.length)out.push({sid,s,flagged:flagged.sort((a,b)=>a.i-b.i)});
  }
  return out.sort((a,b)=>a.s.date.localeCompare(b.s.date));
}
/* the list a pupil is working in now (their current set's list) */
function curList(s){return Math.max(0,listIdxOf(Math.min(s.level,NSETS-1)*10))}

function doRender(){

  $("#nav").innerHTML=TABS.map(([k,l])=>`<button type="button" data-a="tab" data-k="${k}" ${tabOf(S.tab)===k?'aria-current="page"':""}>${l}</button>`).join("");

  const dr=$("#drawer"),open=S.ui.pupil&&S.pupils[S.ui.pupil];
  dr.innerHTML=open?panelHtml(S.ui.pupil):"";
  if(open)dr.setAttribute("aria-label",S.pupils[S.ui.pupil].name+" — spellings");

  if(S.ui.sqShow){S.ui.sqShow=false;const b=$("#sqbar");if(b&&b.scrollIntoView)b.scrollIntoView({block:"nearest"})}

  const pl=$('.pl[aria-current="true"]');if(pl){const box=pl.parentElement;if(box.scrollWidth>box.clientWidth)box.scrollLeft=pl.offsetLeft-box.offsetLeft-12}
  /* a panel that has just opened takes the focus; otherwise put it back where it was */
  if(S.ui.panelFocus){S.ui.panelFocus=false;dr.scrollTop=0;const c=$("#pClose");if(c)c.focus({preventScroll:true})}
  else if(aid){const el=document.getElementById(aid);if(el){el.focus({preventScroll:true});if(sel&&el.setSelectionRange)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}

/* ----- The test plan (shown on Tests) -----
   Classroom Hub. Each child works on one set of ten at a time and moves on
   only at 10/10. The test plan covers the class in as few tests as it can:
   one whole-class test (20 words by default — enough in KS1) placed where
   the most children are, then the shortest group tests for the rest. A
   group test is the lowest remaining set, plus the next set when children
   are waiting on it too, so neighbouring groups share one 20-word test. */
function setsLabel(gs){const a=setWords(gs[0])[0],b=setWords(gs[gs.length-1]).slice(-1)[0];return listIdxOf(a)===listIdxOf(b)?`${listOf(a).short} ${num(a)}–${num(b)}`:`${setLabel(gs[0])} and ${setLabel(gs[gs.length-1])}`}
function testPlan(){
  const ids=pupilIds(),lv={};for(const id of ids)lv[id]=summary(id).level;
  const active=ids.filter(id=>lv[id]<NSETS),W=Math.max(1,Math.round((+S.settings.wholeN||20)/10));
  const tests=[];
  if(!active.length)return {tests,lv,W};
  let best=-1,bestN=-1;
  /* windows start on a set someone is on, so the test begins where they are */
  for(const g of [...new Set(active.map(id=>lv[id]))].sort((a,b)=>a-b)){const n=active.filter(id=>lv[id]>=g&&lv[id]<g+W).length;if(n>bestN){best=g;bestN=n}}
  const sets=[];for(let g=best;g<Math.min(best+W,NSETS);g++)sets.push(g);
  const inWhole=active.filter(id=>lv[id]>=best&&lv[id]<best+W);
  tests.push({whole:true,sets,words:sets.flatMap(setWords),pids:ids,target:inWhole,title:`Whole class · ${setsLabel(sets)}`});
  let rest=active.filter(id=>!inWhole.includes(id)).sort((a,b)=>lv[a]-lv[b]);
  while(rest.length){const g=lv[rest[0]];const two=rest.some(id=>lv[id]===g+1)&&g+1<NSETS&&listIdxOf(g*10)===listIdxOf((g+1)*10);

    tests.push({whole:false,sets:gs,words:gs.flatMap(setWords),pids,target:pids,title:`Group · ${setsLabel(gs)}`});

/* ----- Tests -----

   (pupil, date), so a test is a view over those sessions: a child is marked

function photoSrc(p){if(!p)return null;if(p.startsWith("mem:"))return memPhotos[p.slice(4)]||null;return "/_blob/"+p}
const imgCache={};
function loadImg(src){if(!imgCache[src])imgCache[src]=new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src});return imgCache[src]}
function drawCrops(){
  document.querySelectorAll("canvas[data-crop]").forEach(async cv=>{
    try{const im=await loadImg(cv.dataset.crop);const [x,y,w,h]=cv.dataset.box.split(",").map(Number);
      const px=w*.35,py=h*.6;const sx=Math.max(0,(x-px))*im.naturalWidth,sy=Math.max(0,(y-py))*im.naturalHeight;
      const sw=Math.min(1,w+2*px)*im.naturalWidth,sh=Math.min(1,h+2*py)*im.naturalHeight;
      const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
      const sc=Math.min(cv.width/sw,cv.height/sh);const dw=sw*sc,dh=sh*sc;
      ctx.drawImage(im,sx,sy,sw,sh,(cv.width-dw)/2,(cv.height-dh)/2,dw,dh);
    }catch(e){}
  });
}

function voiceScore(v){const n=v.name;let sc=0;

/* ---------- photo marking ---------- */
function canvasBlob(cv){return new Promise(r=>cv.toBlob(r,"image/jpeg",.88))}
async function prepImages(file){
  const url=URL.createObjectURL(file);
  const im=new Image();im.src=url;await im.decode();
  const W=im.naturalWidth,H=im.naturalHeight;
  const cut=async(y0,y1)=>{const sh=(y1-y0)*H;const sc=Math.min(1,2000/Math.max(W,sh));const cv=document.createElement("canvas");cv.width=Math.round(W*sc);cv.height=Math.round(sh*sc);cv.getContext("2d").drawImage(im,0,y0*H,W,sh,0,0,cv.width,cv.height);return canvasBlob(cv)};
  const full=await cut(0,1),top=await cut(0,.55),bot=await cut(.45,1);
  URL.revokeObjectURL(url);
  return {full,top,bot};
}
function photoPrompt(three){
  const roster=pupilIds().map(id=>S.pupils[id].name);
  return `You are helping a primary school teacher mark a high-frequency word SPELLING check from a photo of one child's answer sheet.

The sheet has a printed header (Name, Date, and a word-number range such as "Words 21-40") and numbered answer boxes. Each box's printed number is the number of the word in the list below. The teacher read each word aloud and the child wrote it in the matching box.
${three?"Image 1 is the whole sheet. Images 2 and 3 are the top and bottom halves of the same sheet at higher resolution; use them to read small letters.":"The image is the whole sheet."}

Word list (number: word):
${WORDS.map((w,i)=>`${i+1}: ${w.replace(/’/g,"'")}`).join("\n")}

Class list: ${roster.join("; ")||"(none)"}

For EVERY numbered box on the sheet:
- "read": transcribe EXACTLY what the child wrote, letter by letter, keeping their capitals and apostrophes. Never correct their spelling. Young children's misspellings are expected (e.g. "sed", "wos", "thay") and must be copied as written. If a letter is reversed (b/d, p/q, s, j) write the letter it was meant to be and set "reversal": true. If the child crossed something out, transcribe their final attempt.
- "confidence": "high" only if you are certain of every letter. Use "low" if any letter is ambiguous, faint, overwritten, cut off, or could be read two ways, or if you are not sure which box the writing belongs to.
- "blank": true if the box is empty (then read is "").
- "note": a few words if anything is unusual (e.g. "second letter could be a or o"), else "".
- "box": approximate [x, y, width, height] of the child's writing in image 1, as fractions 0-1 of the image width and height.

Also read the name written or printed on the sheet, and if it clearly matches someone on the class list give that exact class-list name as "rosterMatch".

Reply with only this JSON:
{"name": string|null, "rosterMatch": string|null, "boxes": [{"n": number, "read": string, "confidence": "high"|"low", "blank": boolean, "reversal": boolean, "note": string, "box": [number,number,number,number]}], "issues": string}
"issues" is "" unless the photo has a problem the teacher should know about (blurred, part of the page missing, not an answer sheet).`;
}
function normWord(t,target){
  let x=String(t||"").trim().replace(/[’‘`´]/g,"'").replace(/^["“”]+|[.,!?;:"“”]+$/g,"");
  let y=target.replace(/’/g,"'");
  if(S.settings.acceptNoApos){x=x.replace(/'/g,"");y=y.replace(/'/g,"")}
  const strict=S.settings.strictCaps&&/[A-Z]/.test(y);
  if(!strict){x=x.toLowerCase();y=y.toLowerCase()}
  return [x,y];
}
function markBox(b){
  const n=Math.round(Number(b.n));if(!(n>=1&&n<=100))return null;
  const r=b.blank?"":String(b.read??"").trim();
  const [x,y]=normWord(r,WORDS[n-1]);
  const ai=r&&x===y?"c":"x";
  const s=b.blank?"x":(b.confidence!=="high"||b.reversal)?"?":ai;
  const box=Array.isArray(b.box)&&b.box.length===4&&b.box.every(v=>typeof v==="number"&&v>=0&&v<=1)?b.box:null;
  return {n,r,ai,s,conf:b.confidence==="high"?"high":"low",note:[b.reversal?"reversed letter":"",b.note||""].filter(Boolean).join("; "),box};
}
function matchPupil(res){
  const ids=pupilIds();const norm=s=>String(s||"").toLowerCase().replace(/[^a-z ]/g,"").trim();
  const exact=ids.find(id=>norm(S.pupils[id].name)===norm(res.rosterMatch))||ids.find(id=>norm(S.pupils[id].name)===norm(res.name));
  if(exact)return exact;
  const n=norm(res.name);if(!n)return "";
  const hits=ids.filter(id=>{const pn=norm(S.pupils[id].name);return pn.split(" ")[0]===n.split(" ")[0]});
  return hits.length===1?hits[0]:"";
}
let jobRunning=false;
async function runJobs(){
  if(jobRunning)return;jobRunning=true;
  try{
    let j;
    while((j=S.ui.jobs.find(x=>x.status==="queued"))){
      j.status="reading";render();
      try{
        if(!j.imgs)j.imgs=await prepImages(j.file);
        j.blob=j.imgs.full;
        const three=(imgLimits.maxCount||1)>=3;
        const res=await sampleApi.json(photoPrompt(three),{images:three?[j.imgs.full,j.imgs.top,j.imgs.bot]:[j.imgs.full],modelTier:"complex"});
        if(!res||!Array.isArray(res.boxes))throw {code:"invalid_json"};
        const seen=new Set();
        j.boxes=res.boxes.map(markBox).filter(b=>b&&!seen.has(b.n)&&seen.add(b.n)).sort((a,b)=>a.n-b.n);
        if(!j.boxes.length)throw {code:"no_boxes"};
        j.nameRead=res.name||"";j.issues=res.issues||"";j.pid=j.pid||matchPupil(res);
        j.status="done";
      }catch(e){
        j.status="error";
        j.err=e.code==="not_granted"?"Claude access wasn’t allowed for this page. Allow it from the page’s permissions to mark photos.":
          e.code==="rate_limited"?"Claude is busy or your usage limit was reached. Wait a moment, then try again.":
          e.code==="image_rejected"?"That image couldn’t be used. Try a JPEG or PNG photo.":
          e.code==="no_boxes"?"No numbered answer boxes were found. Check the photo shows a whole answer sheet.":
          e.code==="invalid_json"?"Claude’s reply couldn’t be read. Try again.":
          (e instanceof Error&&!e.code)?"This photo couldn’t be opened. If it’s HEIC, export it as JPEG.":"Something went wrong reading this sheet. Try again.";
        if(e.code==="not_granted"){S.ui.jobs.forEach(x=>{if(x.status==="queued"){x.status="error";x.err=j.err}})}
      }
      render();
    }
  }finally{jobRunning=false}
}
function addFiles(files){
  for(const f of files){if(!f.type.startsWith("image/")&&!/\.(heic|heif)$/i.test(f.name))continue;
    S.ui.jobs.push({id:uid(),file:f,status:"queued",url:URL.createObjectURL(f),pid:""})}
  render();runJobs();
}
async function saveJob(j){
  if(!j.pid){toast("Choose the pupil first");return}
  j.status="saving";render();
  let photo="mem:"+j.id;memPhotos[j.id]=j.blob?URL.createObjectURL(j.blob):j.url;
  if(assetsApi&&S.mode==="live"&&j.blob){try{const a=await assetsApi.upload(j.blob);photo=a.id}catch(e){toast("Photo not stored; marks saved. You can still review this session now.")}}
  const sid=j.pid+"_"+S.ui.date,old=S.sessions[sid];
  const words={...((old&&old.words)||{})};
  for(const b of j.boxes){const w={s:b.s,r:b.r,ai:b.ai,conf:b.conf,note:b.note,photo,src:"photo"};if(b.box)w.box=b.box;words[b.n-1]=w}
  await saveDoc("sessions",sid,{pupilId:j.pid,date:S.ui.date,kind:"spelling",words,photos:[...((old&&old.photos)||[]),photo],updatedAt:Date.now()});
  j.status="saved";render();

/* ---------- progression plans ---------- */
const ERR={blank:"Left blank",sounded:"Sounded out or another attempt",vowel:"Vowel mix-up",missing:"Missed a letter",extra:"Added a letter",order:"Letters in the wrong order",apostrophe:"Missed the apostrophe",caps:"Capital letter",reversal:"Reversed letters (b/d, p/q)"};
function isSubseq(a,b){let j=0;for(const ch of b){if(ch===a[j])j++}return j===a.length}
function classify(target,read){
  const t=target.replace(/’/g,"'").toLowerCase(),raw=String(read||"").replace(/[’‘]/g,"'").trim(),r=raw.toLowerCase();
  if(!r)return "blank";
  if(r===t)return "caps";
  if(t.includes("'")&&r===t.replace(/'/g,""))return "apostrophe";
  const v=s=>s.replace(/[aeiouy]/g,"*");
  if(r.length===t.length&&v(r)===v(t))return "vowel";
  if(r.length===t.length-1&&isSubseq(r,t))return "missing";
  if(r.length===t.length+1&&isSubseq(t,r))return "extra";
  if(r.length===t.length&&[...r].sort().join("")===[...t].sort().join(""))return "order";
  return "sounded";
}
const addDays=(d,n)=>{const x=new Date(d+"T12:00");x.setDate(x.getDate()+n);return localDate(x)};
const wl=a=>a.map(i=>WORDS[i]).join(", ");
function buildPlan(pid){
  if(memo["plan"+pid])return memo["plan"+pid];
  const s=summary(pid),pl=S.plans[pid]||{},pr=practiceFor(pid),boxes=pr.boxes||{},first=S.pupils[pid].name.split(" ")[0];
  const assessed=s.sessions.length>0,plateau=s.delta!=null&&s.delta<=0,gains=s.delta!=null&&s.delta>=10;
  const autoN=plateau?3:gains?8:5,focusN=pl.focusN||autoN;
  const idx=s.ws.map((w,i)=>i);
  const revisit=idx.filter(i=>s.ws[i].st==="slipped").slice(0,5);
  const open=idx.filter(i=>!isKnown(s.ws[i].st)&&s.ws[i].st!=="slipped");
  const focus=open.slice(0,focusN),nextUp=open.slice(focusN,focusN+5);
  const pats={};const add=(k,i,r)=>{const p=pats[k]=pats[k]||{n:0,ex:[]};p.n++;if(r&&p.ex.length<3)p.ex.push([i,r])};
  s.ws.forEach((w,i)=>{if(w.st!=="notyet"&&w.st!=="slipped")return;const last=[...w.hist].reverse().find(h=>h.s==="x");if(!last||last.r==null)return;
    add(classify(WORDS[i],last.r),i,last.r);if(/revers/i.test(last.note||""))add("reversal",i,last.r)});
  const n=k=>pats[k]?pats[k].n:0,ex=k=>(pats[k]?pats[k].ex:[]).map(([i,r])=>`“${r}” for ${WORDS[i]}`).join(", ");
  const ready=Object.entries(boxes).filter(([i,v])=>v>=3&&!isKnown(s.ws[+i].st)).map(([i])=>+i);
  const recs=[];
  if(!assessed)recs.push({t:"Baseline check",f:"This week",d:"Run the spelling check (Print > Answer sheets) so this plan can be based on real results. Until then it starts from the first words on the list."});
  if(plateau)recs.push({t:"Smaller steps",f:"Daily",d:`No gain since the last check, so the focus set is ${focusN} words. Short daily 1:1 practice works better than longer weekly sessions.`});
  if(focus.length)recs.push({t:"Flash cards",f:"5 minutes daily",d:`Read the ${focus.length} focus words quickly. Keep any ‘not yet’ cards in the pile and go round again.`});
  if(n("blank")>=3&&n("blank")>=n("sounded"))recs.push({t:"Recognise before spelling",f:"Daily",d:`${n("blank")} words were left blank. Build reading first: Listen and find in the app, and spot the words in reading books, before asking for spellings.`});
  if(n("sounded")>=2)recs.push({t:"Look, say, cover, write, check",f:"3 times a week",d:`${first} is sounding words out (${ex("sounded")}). Point out the tricky part of each word, then use the look-cover-write-check sheet.`});
  if(n("vowel")+n("missing")+n("extra")>=2)recs.push({t:"Missing letters",f:"Twice a week",d:`Most letters are right but one is missed or swapped (${[ex("vowel"),ex("missing"),ex("extra")].filter(Boolean).join(", ")}). Use the missing-letters sheet and say each sound while writing.`});
  if(n("order"))recs.push({t:"Build the word",f:"Twice a week",d:`The right letters are there in the wrong order (${ex("order")}). Use letter tiles or the Build the word game.`});
  if(n("reversal"))recs.push({t:"Letter formation",f:"Daily warm-up",d:"Some letters are reversed. Use the trace-and-write sheet and model the correct formation for b, d, p and q."});
  if(n("apostrophe"))recs.push({t:"Contractions",f:"One short lesson, then revisit",d:"Teach it’s = it is, don’t = do not, I’m = I am, and show the apostrophe standing in for the missing letter."});
  if(revisit.length)recs.push({t:"Revisit slipped words",f:"Daily warm-up",d:`${wl(revisit)} ${revisit.length>1?"were":"was"} correct before. Add ${revisit.length>1?"them":"it"} back into flash cards until secure.`});
  if(ready.length)recs.push({t:"Re-check",f:"Next 1:1",d:`${wl(ready)} reached the top of the practice ladder. Check ${ready.length>1?"them":"it"} 1:1 and mark in Quick check.`});
  if(gains)recs.push({t:"Keep the pace",f:"Ongoing",d:`Strong progress (+${s.delta}) since the last check, so the focus set is ${focusN} words.`});
  if(focus.length)recs.push({t:"Practice sheets and sentences",f:"2–3 times a week",d:"Practice sheets from the Print tab, plus dictating the sentence for each focus word (Print > Dictation script)."});
  const reviewDate=pl.reviewDate||addDays(s.lastDate||localDate(),14);
  const criteria=focus.length||revisit.length?`${first} spells ${wl([...focus,...revisit])} correctly in two separate checks.`:`${first} keeps every word secure.`;
  const log=pr.log||[];
  return memo["plan"+pid]={s,pl,first,focusN,autoN,focus,nextUp,revisit,pats,recs,ready,reviewDate,criteria,plateau,gains,assessed,sessions:log.length,lastPractice:log.length?log[log.length-1].date:null,boxes};
}

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function hashStr(s){let h=2166136261;for(const ch of s)h=Math.imul(h^ch.charCodeAt(0),16777619);return h>>>0}

function drawHalves(c,halves){
  halves.forEach((fn,k)=>{if(!fn)return;c.save();c.translate(0,k*HH);c.strokeStyle="#333";c.lineWidth=3;rr(c,34,34,HW-68,HH-68,22);c.stroke();fn(c);c.restore()});

const dayLabel=(d,days)=>days>1?`Day ${d+1} · ${WEEKDAYS[d%5]}${days>5?` (week ${Math.floor(d/5)+1})`:""}`:"";

/* The daily practice page: look-say-cover-write-check for up to 8 words.
   `name` blank prints a name line instead. */

  c.textAlign="right";if(name){c.font=`700 30px ${FW}`;c.fillStyle="#111";c.fillText(name,x1,100)}else{c.font=`400 24px ${FU}`;c.fillStyle="#333";c.fillText("Name: __________________",x1,100)}
  const top=162,bottom=HH-92,wW=270,tk=72,cW=(x1-x0-wW-2*tk)/2,hdr=44,n=words.length,rh=Math.min(112,(bottom-top-hdr)/n);
  const xs=[x0,x0+wW,x0+wW+cW,x0+wW+cW+tk,x0+wW+2*cW+tk,x1];
  c.fillStyle="#eef1f6";c.fillRect(x0,top,x1-x0,hdr);

  words.forEach((i,k)=>{const y=top+hdr+k*rh;c.fillStyle="#111";c.textAlign="center";fitFont(c,WORDS[i],700,Math.min(64,rh*.55),28,wW-30);c.fillText(WORDS[i],x0+wW/2,y+rh*.68);
    guides(c,xs[1]+14,xs[2]-14,y+rh*.74,rh*.2);guides(c,xs[3]+14,xs[4]-14,y+rh*.74,rh*.2);
    c.strokeStyle="#c3cad8";c.lineWidth=1.5;c.beginPath();c.moveTo(x0,y+rh);c.lineTo(x1,y+rh);c.stroke()});
  c.strokeStyle="#6f7a90";c.lineWidth=2;c.strokeRect(x0,top,x1-x0,tb-top);c.beginPath();c.moveTo(x0,top+hdr);c.lineTo(x1,top+hdr);[2,3,4].forEach(k=>{c.moveTo(xs[k],top);c.lineTo(xs[k],tb)});c.stroke();
  c.setLineDash([12,9]);c.lineWidth=3;c.beginPath();c.moveTo(xs[1],top-12);c.lineTo(xs[1],tb+12);c.stroke();c.setLineDash([]);
  c.textAlign="left";c.font=`400 19px ${FU}`;c.fillStyle="#666";c.fillText("Look at each word and say it. Fold along the dashed line to cover it. Write it, unfold and check. Tick when it’s right.",x0,HH-58,x1-x0);

function coverPage(c,{band,title,sub,target,words,days}){

  y+=52;c.font=`400 21px ${FU}`;c.fillStyle="#333";y=wrapText(c,"My target: "+target,x0,y,x1-x0,28)+8;

    c.strokeStyle="#9aa3b5";c.lineWidth=1.5;for(let d=0;d<cols;d++)c.strokeRect(x0+ww+d*cell+4,yy+3,cell-8,rh-6)});

/* An A4 activity sheet as one A5 page of a book: the same drawing, turned
   on its side so it fills the page. */
function actHalf(k,ws,label){
  return c=>{const {cv,c:a}=cpage();ACTS[k].draw(a,ws,label);const m=46,z=Math.min((HW-2*m)/CH,(HH-2*m)/CW);
    c.save();c.translate(HW/2,HH/2);c.rotate(-Math.PI/2);c.drawImage(cv,-CW*z/2,-CH*z/2,CW*z,CH*z);c.restore()};
}
/* A book's A5 pages, in order: a cover (not for a single day), then each
   day's pages with the words in a fresh order each day. A day has the look,
   say, cover, write, check page when that is ticked, then one of the other
   ticked activities, taking turns through the book. With only look, say,
   cover, write, check ticked this is the daily practice book as it always
   printed. Every book in a print has the same number of pages. */
function bookFrom({key,words,days,acts,label,cover,day}){
  acts=(acts||[]).filter(k=>ACTS[k]);if(!acts.length)acts=["lcwc"];
  const lcwc=acts.includes("lcwc"),others=acts.filter(k=>k!=="lcwc"),used={};
  const pages=days>1?[cover]:[];
  for(let d=0;d<days;d++){const r=rngFrom(hashStr(key)+d*7919),order=d===0?words:words.map(v=>[r(),v]).sort((a,b)=>a[0]-b[0]).map(p=>p[1]);
    if(lcwc)pages.push(c=>day(c,order,d));
    if(others.length){const k=others[d%others.length],per=ACTS[k].per,n=Math.ceil(order.length/per),at=(used[k]=(used[k]||0)+1)-1;
      pages.push(actHalf(k,order.slice((at%n)*per,(at%n)*per+per),label))}}
  return pages;
}
function bookPages(pid,days,acts){
  const words=bookWords(pid);if(!words.length)return null;
  return bookFrom({key:pid,words,days,acts,label:S.pupils[pid].name,cover:c=>drawCover(c,pid,words,days),day:(c,order,d)=>drawDay(c,pid,order,d,days)});
}
function bandBookPages(g,days,acts){
  const words=setWords(g),b=BANDS[g%10];
  return bookFrom({key:"band"+g,words,days,acts,label:"",
    cover:c=>coverPage(c,{band:b.c==="#f4f4f4"?"#cccccc":b.c,title:`My ${b.n.toLowerCase()} spelling book`,sub:["Name ____________________",S.settings.className,setLabel(g)],target:"I can spell all of these words.",words,days}),
    day:(c,order,d)=>drawDayPage(c,"",order,dayLabel(d,days))});
}
/* Stack and cut. Every book in a print has the same number of pages, and
   sheet k carries page k of one book on top and page k of the next book
   below. Print single-sided, square the stack, cut once across the middle:
   each pile is a run of complete books, already in page order. A lone book
   is split instead: first half down the top, second half down the bottom. */
function layBooks(doc,books){
  if(books.length===1){const b=books[0],m=Math.ceil(b.length/2);for(let k=0;k<m;k++)bookPage(doc,[b[k],b[m+k]]);return}
  for(let j=0;j<books.length;j+=2){const a=books[j],b=books[j+1]||[];for(let k=0;k<a.length;k++)bookPage(doc,[a[k],b[k]])}
}
function bookNote(names,days,pp=days>1?days+1:1){
  const what=days>1?`${days}-day books`:pp>1?"one-day books":"one-day pages",n=names.length;
  if(n===1)return pp>1?`Print single-sided, square the stack and cut across the middle. Put the bottom pile under the top pile and staple: that’s ${names[0]}’s book in page order.`:`Print and cut across the middle.`;
  const top=names.filter((_,k)=>k%2===0),bot=names.filter((_,k)=>k%2===1);
  return `${n} ${what} on ${Math.ceil(n/2)*pp} A4 sheets. Print single-sided, square the stack and cut once across the middle (the A4 half). Top pile, in order: ${top.join(", ")}. Bottom pile: ${bot.join(", ")}.${pp>1?" Each book is the next "+pp+" pages of its pile.":""}`;
}

Words most pupils can't yet spell (count of pupils): ${top||"none"}
Sample of misspellings (target→written): ${mis.slice(0,80).join(", ")||"none recorded"}
Pupils:
${lines.join("\n")}`;
  S.ui.ai={status:"thinking",text:""};render();

document.addEventListener("input",e=>{const el=e.target;if(el.dataset.bind)S.ui[el.dataset.bind]=el.value;if(el.dataset.bindPlan)S.ui.planDraft[el.dataset.bindPlan]=el.value});
document.addEventListener("change",e=>{
  const el=e.target,c=el.dataset.c;if(!c)return;
  switch(c){
    case "date":{const q=S.ui.quick,d=el.value||localDate();
      /* a test's date is the date of its marks: changing it here moves the test, as Change date does */
      if(S.tab==="mark"&&q.test==="test"&&q.only){const t=(q.testId&&findTest(q.testId))||(q.snap&&{...q.snap,date:S.ui.date});
        if(t&&d!==t.date){
          if(moveClashes(t,d).length){toast(`Not moved: some children already have marks for these words on ${fmtDay(d)}. Change date on Tests can replace them.`);break}
          q.testId=moveTest(t,d);if(q.snap)q.snap.date=d;toast(`Test moved to ${fmtDay(d)}`)}}
      S.ui.date=d;break}
    case "tPlanDate":if(S.ui.tests.plan)S.ui.tests.plan.date=el.value;break;
    case "tEditDate":if(S.ui.tests.edit){S.ui.tests.edit.date=el.value;S.ui.tests.edit.clash=0}break;
    case "jobPupil":{const j=S.ui.jobs.find(x=>x.id===el.dataset.j);if(j)j.pid=el.value;break}
    case "markTest":{const v=el.value;if(v==="one")markOne();else if(v!=="cur"){const t=findTest(v);if(t)loadTest(testFull(t))}break}
    case "qWrote":{const cur=quickWords(),i=el.dataset.i;if(cur[i]&&cur[i].s==="x"){const r=el.value.trim().slice(0,40);cur[i]={...cur[i]};if(r)cur[i].r=r;else delete cur[i].r;saveQuickWords(cur)}break}
    case "voice":lsSet("hw-voice",el.value||null);say("Let’s practise. said. “Hello,” said Mum.");break;
    case "rate":lsSet("hw-rate",el.value);break;
    case "cardsPerChild":saveDoc("settings","main",{...S.settings,cardsPerChild:+el.value});break;
    case "planFocus":savePlan(el.dataset.id,{focusN:el.value?+el.value:null});break;
    case "planReview":if(el.value)savePlan(el.dataset.id,{reviewDate:el.value});break;
    case "planNotes":savePlan(el.dataset.id,{notes:el.value.slice(0,2000)});delete S.ui.planDraft[el.dataset.id];break;
    case "rename":{const p=S.pupils[el.dataset.id];const v=el.value.trim();if(p&&v&&v!==p.name)saveDoc("pupils",el.dataset.id,{...p,name:v.slice(0,60)});break}
    case "wholeN":saveDoc("settings","main",{...S.settings,wholeN:+el.value});break;
    case "className":saveDoc("settings","main",{...S.settings,className:el.value.trim().slice(0,60)});break;
    case "strictCaps":case "acceptNoApos":saveDoc("settings","main",{...S.settings,[c]:el.checked});break;
  }
  render();
});

/* ---------- example class ---------- */
let saved=null;
function loadDemo(){
  saved={pupils:S.pupils,sessions:S.sessions,practice:S.practice,plans:S.plans,tests:S.tests,settings:S.settings,mode:S.mode};
  let seed=7;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const names=["Ava Smith","Noah Patel","Isla Jones","Leo Brown","Amelia Khan","Oliver Wilson","Freya Taylor","Arthur Davies","Mia Evans","Theo Thomas","Ivy Roberts","Jack Walker","Poppy Wright","Muhammad Ali","Grace Hughes","Harry Green","Zara Hussain","Oscar Hall","Ruby Clarke","Alfie Lewis","Sofia Lopez","Finley Scott","Aisha Begum","Reuben Wood"];
  const MIS={4:"sed",10:"wos",11:"yoo",12:"thay",32:"wot",33:"thair",36:"hav",40:"sum",43:"wer",45:"littel",51:"wun",53:"thim",64:"dont",65:"cum",59:"its",61:"lookt",70:"childen",74:"askt",80:"abowt",82:"thier",83:"peple",86:"cud",87:"hous",94:"Im",98:"cald"};
  const pupils={},sessions={},practice={};
  names.forEach((nm,k)=>{const id="d"+k;pupils[id]={name:nm};const a=.12+rnd()*.85;
    [["2026-09-08",0],["2026-10-06",1]].forEach(([d,t])=>{const words={};const ab=a+t*(.04+rnd()*.12);
      for(let i=0;i<100;i++){const p=1/(1+Math.exp(-((ab*115-i)/7)));const ok=rnd()<p;const w=WORDS[i];
        words[i]={s:ok?"c":"x",r:ok?w:(MIS[i]&&rnd()<.6?MIS[i]:w.length>2?w.slice(0,-1):""),src:"photo"}}
      if(t===1&&k%7===2){words[5+k]={s:"?",r:WORDS[5+k].replace(/[ae]/,"o"),ai:"x",conf:"low",note:"one letter could be read two ways",src:"photo"}}
      sessions[id+"_"+d]={pupilId:id,date:d,kind:"spelling",words}});
    if(k%3===0){const b={};let n=0;for(let i=0;i<100&&n<6;i++){if(sessions[id+"_2026-10-06"].words[i].s!=="c"){b[i]=1+Math.floor(rnd()*3);n++}}practice[id]={boxes:b,log:[]}}
  });
  Object.assign(S,{pupils,sessions,practice,plans:{},tests:{},settings:{className:"Year 1 Oak (example)",strictCaps:false,acceptNoApos:false,cardsPerChild:10},mode:"demo"});
  S.ui.jobs=[];S.ui.ai=null;setTab(DEFAULT_TAB);render();
}
function exitDemo(){
  if(saved){Object.assign(S,{pupils:saved.pupils,sessions:saved.sessions,practice:saved.practice,plans:saved.plans,tests:saved.tests,settings:saved.settings,mode:saved.mode});saved=null}
  S.ui.pupil=null;S.ui.cell=null;S.ui.ai=null;S.ui.act=null;S.ui.practise.pid=null;S.ui.plan=null;setTab(pupilIds().length?DEFAULT_TAB:"settings");render();
}

/* ---------- boot ---------- */
(async function boot(){
  render();
  if(!window.claude||!window.claude.use){S.mode="offline";render();return}
  const [d,sa,as,dw]=await Promise.all(["db","sample","assets","downloads"].map(n=>window.claude.use(n).catch(()=>null)));
  sampleApi=sa;assetsApi=as;dl=dw;
  if(sampleApi){try{imgLimits=(await sampleApi.limits()).images||null}catch(e){imgLimits=null}}
  if(!d){if(saved)saved.mode="offline";else S.mode="offline";render();return}
  db=d;
  const target=()=>saved||S;
  const ready={};
  const markReady=k=>{if(!ready[k]){ready[k]=1;if(Object.keys(ready).length===6){if(saved)saved.mode="live";else S.mode="live"}}render()};
  const lost=()=>toast("Lost connection to your saved data. Reload to reconnect.");
  for(const col of ["pupils","sessions","practice","plans","tests"])db.collection(col).onSnapshot(snap=>{const o={};snap.docs.forEach(x=>o[x.id]=x.data());target()[col]=o;markReady(col)},lost);
  db.doc("settings/main").onSnapshot(snap=>{target().settings={className:"",strictCaps:false,acceptNoApos:false,cardsPerChild:10,...(snap.exists?snap.data():{})};markReady("settings")},lost);
})();
